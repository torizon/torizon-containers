# description: launches the Weston Compositor with shell and then Chromium opening the Toradex Homepage
services:
  weston:
    network_mode: host
    cap_add:
      - CAP_SYS_TTY_CONFIG
    volumes:
      - '/dev:/dev'
      - '/tmp:/tmp'
      - '/run/udev:/run/udev'
    device_cgroup_rules:
      - 'c 4:* rmw'
      - 'c 10:* rmw'
      - 'c 13:* rmw'
      - 'c 195:* rmw'
      - 'c 226:* rmw'
      - 'c 500:* rmw'
      - 'c 501:* rmw'
      - 'c 502:* rmw'
      - 'c 505:* rmw'
    image: '$REGISTRY/torizon/weston-jetson:stable-rc'
    command: '--developer --tty=/dev/tty7 -- --debug'

  chromium:
    command: https://www.toradex.com
    depends_on:
      weston:
        condition: service_healthy
    device_cgroup_rules:
      - 'c 10:* rmw'
      - 'c 195:* rmw'
      - 'c 226:* rmw'
      - 'c 500:* rmw'
      - 'c 501:* rmw'
      - 'c 502:* rmw'
      - 'c 505:* rmw'
    image: $REGISTRY/torizon/chromium-jetson:stable-rc
    security_opt:
      - seccomp:unconfined
    shm_size: 1gb
    volumes:
      - '/dev:/dev'
      - '/tmp:/tmp'
      - '/var/run/dbus:/var/run/dbus'
