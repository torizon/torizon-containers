# description: smile at the camera and the board swaps your face into a character portrait
services:
  weston:
    image: '$REGISTRY/torizon/weston-orin:wrynose-rc'
    command: '--developer --tty=/dev/tty7'
    network_mode: host
    cap_add:
      - CAP_SYS_TTY_CONFIG
    volumes:
      - '/dev:/dev'
      - '/tmp:/tmp'
      - '/run/udev/:/run/udev/'
    device_cgroup_rules:
      - 'c 4:* rmw'
      - 'c 10:* rmw'
      - 'c 13:* rmw'
      - 'c 195:* rmw'
      - 'c 226:* rmw'
      - 'c 500:* rmw'
      - 'c 501:* rmw'
      - 'c 502:* rmw'
      - 'c 505:* rmw'
    restart: unless-stopped

  photo-booth:
    image: 'lbornia/photo-booth:orin'
    network_mode: host
    environment:
      EFFECT_PACK: /app/effects/pack.json
      PORT: "8080"
      CAMERA_WAIT_S: "6"
      CAMERA_DEVICE: ""
      CAMERA_HUB_PATTERN: ""
    volumes:
      - '/dev:/dev'
      - '/sys:/sys:ro'
      - 'trt-engines:/engines'
    device_cgroup_rules:
      - 'c 81:* rmw'
      - 'c 10:* rmw'
      - 'c 226:* rmw'
      - 'c 500:* rmw'
      - 'c 501:* rmw'
      - 'c 502:* rmw'
      - 'c 505:* rmw'
    restart: unless-stopped

  chromium:
    image: '$REGISTRY/torizon/chromium-orin:wrynose-rc'
    command: http://127.0.0.1:8080
    network_mode: host
    depends_on:
      weston:
        condition: service_healthy
    security_opt:
      - seccomp:unconfined
    shm_size: 1gb
    volumes:
      - '/dev:/dev'
      - '/tmp:/tmp'
      - '/var/run/dbus:/var/run/dbus'
    device_cgroup_rules:
      - 'c 10:* rmw'
      - 'c 195:* rmw'
      - 'c 226:* rmw'
      - 'c 500:* rmw'
      - 'c 501:* rmw'
      - 'c 502:* rmw'
      - 'c 505:* rmw'
    restart: unless-stopped

volumes:
  trt-engines:
