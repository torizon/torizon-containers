# description: launches the Luna Dual Cameras AI demo application
services:
  weston:
    image: '$REGISTRY/${REGISTRY_NAMESPACE}/weston-sl1680:${IMAGE_TAG}'
    network_mode: host
    cap_add:
      - CAP_SYS_TTY_CONFIG
    device_cgroup_rules:
      - 'c 4:* rmw'
      - 'c 13:* rmw'
      - 'c 226:* rmw'
    volumes:
      - '/dev:/dev'
      - '/tmp:/tmp'
      - '/run/udev/:/run/udev/'
    command: '--developer --tty=/dev/tty7 -- --debug'

  luna-cameras-ai-demo:
    image: 'lbornia/luna-dual-cameras:latest'
    container_name: luna-cameras-ai-demo
    depends_on:
      weston:
        condition: service_healthy
    network_mode: host
    privileged: true
    volumes:
      - '/dev:/dev'
      - '/tmp:/tmp'
      - '/run/udev:/run/udev'
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ws-ready"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s

  chromium:
    image: '$REGISTRY/${REGISTRY_NAMESPACE}/chromium-sl1680:${IMAGE_TAG}'
    container_name: chromium
    depends_on:
      luna-cameras-ai-demo:
        condition: service_healthy
    command: http://127.0.0.1
    network_mode: host
    security_opt:
      - seccomp:unconfined
    shm_size: 256mb
    device_cgroup_rules:
      - 'c 226:* rmw'
    volumes:
      - '/tmp:/tmp'
      - '/var/run/dbus:/var/run/dbus'
      - '/dev/dri:/dev/dri'
