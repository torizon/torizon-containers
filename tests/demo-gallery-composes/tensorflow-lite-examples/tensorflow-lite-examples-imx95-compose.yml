# description: launches the tensorflow lite example
services:
  tensorflow-lite-examples:
    volumes:
        - /dev:/dev
        - /tmp:/tmp
    device_cgroup_rules:
        - 'c 239:0 rmw'
    image: '$REGISTRY/${REGISTRY_NAMESPACE}/tensorflow-lite-examples-imx95:${IMAGE_TAG}'
    command: /bin/sh -lc ". /app/.venv/bin/activate && python3 /app/infer.py"
