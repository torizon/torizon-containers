# description: launches the tensorflow lite example
services:
  tensorflow-lite-examples:
    volumes:
        - /dev:/dev
        - /tmp:/tmp
    device_cgroup_rules:
        - 'c 199:0 rmw'
    image: 'torizon/tensorflow-lite-examples-imx8:${RELEASE_TAG}-rc'
    command: /bin/sh -lc ". /app/.venv/bin/activate && python3 /app/infer.py"
