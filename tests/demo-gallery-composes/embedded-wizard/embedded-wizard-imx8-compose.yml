# description: launches the Embedded-Wizard demo application
services:
  embedded-wizard:
    image: embeddedwizard/ew-demo:ewdemo-verdin_imx8mp
    container_name: embedded-wizard-imx8
    volumes:
      - '/dev:/dev'
      - '/tmp:/tmp'
    device_cgroup_rules:
      - 'c 4:0 rmw'
      - 'c 4:7 rmw'
      - 'c 13:* rmw'
      - 'c 199:* rmw'
      - 'c 226:* rmw'
    depends_on:
      weston:
        condition: service_healthy

  weston:
    network_mode: host
    cap_add:
      - CAP_SYS_TTY_CONFIG
    volumes:
      - '/dev:/dev'
      - '/tmp:/tmp'
      - '/run/udev:/run/udev'
    device_cgroup_rules:
      - 'c 4:* rmw'
      - 'c 253:* rmw'
      - 'c 13:* rmw'
      - 'c 226:* rmw'
      - 'c 10:223 rmw'
      - 'c 199:0 rmw'
    image: '$REGISTRY/torizon/weston-imx8:${RELEASE_TAG}-rc'
    command: '--developer --tty=/dev/tty7 -- --debug'

