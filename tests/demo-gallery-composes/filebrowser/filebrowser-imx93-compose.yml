# description: launches a file browser on /etc that can be accessed at <board_ip>:8000
services:
  filebrowser:
    image: filebrowser/filebrowser
    container_name: filebrowser
    ports:
      - "0.0.0.0:8000:80"
    volumes:
      - /etc:/srv
    environment:
      - FB_BASEURL=/
      - FB_PORT=80
    restart: on-failure
    command: --noauth
