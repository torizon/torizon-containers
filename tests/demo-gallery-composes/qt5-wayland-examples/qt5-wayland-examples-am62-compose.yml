# description: launches the Weston Compositor with shell and a Qt5 Calculator App
services:
  weston:
    network_mode: host
    cap_add:
      - CAP_SYS_TTY_CONFIG
    volumes:
      - '/dev:/dev'
      - '/tmp:/tmp'
      - '/run/udev:/run/udev'
    device_cgroup_rules:
      - 'c 4:* rmw'
      - 'c 13:* rmw'
      - 'c 226:* rmw'
    image: '$REGISTRY/${REGISTRY_NAMESPACE}/weston-am62:${IMAGE_TAG}'
    command: '--developer'

  qt5-wayland-examples:
    depends_on:
      weston:
        condition: service_healthy
    device_cgroup_rules:
      - 'c 226:* rmw'
    image: $REGISTRY/${REGISTRY_NAMESPACE}/qt5-wayland-examples-am62:${IMAGE_TAG}
    volumes:
      - '/tmp:/tmp'
      - '/dev/dri:/dev/dri'
    command: /usr/lib/aarch64-linux-gnu/qt5/examples/widgets/widgets/calculator/calculator 
