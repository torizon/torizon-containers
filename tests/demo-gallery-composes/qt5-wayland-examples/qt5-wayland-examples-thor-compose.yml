# description: launches the Weston Compositor with shell and a Qt5 Calculator App
services:
  weston:
    network_mode: host
    cap_add:
      - CAP_SYS_TTY_CONFIG
    volumes:
      - '/dev:/dev'
      - '/tmp:/tmp'
      - '/run/udev:/run/udev'
    device_cgroup_rules:
      - 'c 4:* rmw'
      - 'c 10:* rmw'
      - 'c 13:* rmw'
      - 'c 195:* rmw'
      - 'c 226:* rmw'
      - 'c 500:* rmw'
      - 'c 501:* rmw'
      - 'c 502:* rmw'
      - 'c 505:* rmw'
    image: '$REGISTRY/torizon/weston-thor:${RELEASE_TAG}-rc'
    command: '--developer --tty=/dev/tty7 -- --debug'

  qt5-wayland-examples:
    depends_on:
      weston:
        condition: service_healthy
    device_cgroup_rules:
      - 'c 10:* rmw'
      - 'c 195:* rmw'
      - 'c 226:* rmw'
      - 'c 500:* rmw'
      - 'c 501:* rmw'
      - 'c 502:* rmw'
      - 'c 505:* rmw'
    image: $REGISTRY/torizon/qt5-wayland-examples-thor:${RELEASE_TAG}-rc
    volumes:
      - '/dev:/dev'
      - '/tmp:/tmp'
    command: /usr/lib/aarch64-linux-gnu/qt5/examples/widgets/widgets/calculator/calculator
