services:
  weston:
    network_mode: host
    cap_add:
      - CAP_SYS_TTY_CONFIG
    volumes:
      - /dev:/dev
      - /tmp:/tmp
      - /run/udev:/run/udev
    device_cgroup_rules:
      - c 4:* rmw
      - c 13:* rmw
      - c 226:* rmw
      - c 10:223 rmw
    image: $REGISTRY/${REGISTRY_NAMESPACE}/weston-am67a:${IMAGE_TAG}
    command: --developer --tty=/dev/tty7 -- --debug

  graphics-tests:
    depends_on:
      weston:
        condition: service_healthy
    image: $REGISTRY/${REGISTRY_NAMESPACE}/graphics-tests-am67a:${IMAGE_TAG}
    container_name: graphics-tests
    stdin_open: true
    tty: true
    volumes:
      - /dev:/dev
      - /tmp:/tmp
    device_cgroup_rules:
      - "c 4:* rmw"
      - "c 13:* rmw"
      - "c 199:* rmw"
      - "c 226:* rmw"
