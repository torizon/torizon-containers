services:
  weston:
    network_mode: host
    cap_add:
      - CAP_SYS_TTY_CONFIG
    volumes:
      - /dev:/dev
      - /tmp:/tmp
      - /run/udev:/run/udev
    device_cgroup_rules:
      - c 4:* rmw
      - c 253:* rmw
      - c 10:* rmw
      - c 13:* rmw
      - c 226:* rmw
      - c 199:0 rmw
    image: $REGISTRY/${REGISTRY_NAMESPACE}/weston-imx95:${IMAGE_TAG}
    command: --developer --tty=/dev/tty7 -- --debug

  graphics-tests:
    depends_on:
      weston:
        condition: service_healthy
    image: $REGISTRY/${REGISTRY_NAMESPACE}/graphics-tests-imx95:${IMAGE_TAG}
    container_name: graphics-tests
    privileged: true
    stdin_open: true
    tty: true
    environment:
      ACCEPT_FSL_EULA: "1"
    volumes:
      - /dev:/dev
      - /tmp:/tmp
