services:
  weston:
    network_mode: host
    cap_add:
      - CAP_SYS_TTY_CONFIG
    volumes:
      - /dev:/dev
      - /tmp:/tmp
      - /run/udev:/run/udev
    device_cgroup_rules:
      - c 4:* rmw
      - c 13:* rmw
      - c 226:* rmw
      - c 10:223 rmw
    image: $REGISTRY/torizon/weston:stable-rc
    command: --developer --tty=/dev/tty7 -- --debug

  graphics-tests:
    depends_on:
      weston:
        condition: service_healthy
    environment:
        - ACCEPT_FSL_EULA=1
    stdin_open: true
    tty: true
    privileged: true
    container_name: graphics-tests
    volumes:
        - /dev:/dev
        - /tmp:/tmp
    image: $REGISTRY/torizon/graphics-tests:stable-rc
