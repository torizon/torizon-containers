services:
  gtk3-tests:
    image: $REGISTRY/torizon/gtk3-tests-orin:${RELEASE_TAG}-rc
    container_name: gtk3-tests
    stdin_open: true
    tty: true
    command: bash
    volumes:
      - /dev:/dev
      - /tmp:/tmp
    device_cgroup_rules:
      - c 10:* rmw    
      - c 226:* rmw   
      - c 502:* rmw   
      - c 503:* rmw   