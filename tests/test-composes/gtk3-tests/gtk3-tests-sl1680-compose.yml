services:
  gtk3-tests:
    image: $REGISTRY/${REGISTRY_NAMESPACE}/gtk3-tests-sl1680:${IMAGE_TAG}
    container_name: gtk3-tests
    stdin_open: true
    tty: true
    command: bash
    volumes:
      - /dev:/dev
      - /tmp:/tmp
    device_cgroup_rules:
      - "c 4:* rmw"
      - "c 13:* rmw"
      - "c 199:* rmw"
      - "c 226:* rmw"
