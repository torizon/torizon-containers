# description: launches the slint demo application
services:
  slint:
    image: ghcr.io/slint-ui/slint/torizon-demos-arm64-imx95:latest
    container_name: slint-imx95
    
    # Map necessary hardware paths
    volumes:
      - /dev:/dev
      - /tmp:/tmp
      - /run/udev:/run/udev

    # Grant specific permissions to hardware devices (GPU, Screen, Input)
    device_cgroup_rules:
      - 'c 199:* rmw' # Vivante GPU (specific to i.MX8)
      - 'c 226:* rmw' # DRM/KMS (Display)
      - 'c 13:* rmw'  # Input devices (Touch/Mouse)
      - 'c 4:* rmw'   # TTY/Console access
