# description: launches the Embedded-Wizard demo application
services:
  ew-demo:
    restart: always
    device_cgroup_rules:
    - c 4:0 rmw
    - c 4:7 rmw
    - c 13:* rmw
    - c 199:* rmw
    - c 226:* rmw
    volumes:
    - target: /tmp
      source: /tmp
      type: bind
    - target: /dev
      source: /dev
      type: bind
    depends_on:
    - weston
    image: embeddedwizard/ew-demo:ewdemo-verdin_imx8mp

  weston:
    cap_add:
    - CAP_SYS_TTY_CONFIG
    volumes:
    - target: /tmp
      source: /tmp
      type: bind
    - target: /dev
      source: /dev
      type: bind
    - target: /run/udev
      source: /run/udev
      type: bind
    device_cgroup_rules:
    - c 4:0 rmw
    - c 4:1 rmw
    - c 4:7 rmw
    - c 13:* rmw
    - c 199:* rmw
    - c 226:* rmw
    network_mode: host
    environment:
    - ACCEPT_FSL_EULA=1
    image: $REGISTRY/torizon/weston-imx8:stable-rc
