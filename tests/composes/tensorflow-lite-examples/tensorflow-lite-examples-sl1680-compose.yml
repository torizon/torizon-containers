# description: launches the tensorflow lite example
services:
  tensorflow-lite:
    volumes:
        - /dev:/dev
        - /tmp:/tmp
    device_cgroup_rules:
        - 'c 10:119 rmw'
    image: 'torizon/tensorflow-lite-examples-sl1680:4'
    command: /bin/sh -lc ". /app/.venv/bin/activate && python3 /app/infer.py"
