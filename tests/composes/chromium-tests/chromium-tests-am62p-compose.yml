services:
  weston:
    network_mode: host
    cap_add:
      - CAP_SYS_TTY_CONFIG
    volumes:
      - '/dev:/dev'
      - '/tmp:/tmp'
      - '/run/udev/:/run/udev/'
    device_cgroup_rules:
      - 'c 4:* rmw'
      - 'c 13:* rmw'
      - 'c 226:* rmw'
    image: '$REGISTRY/torizon/weston-am62p:stable-rc'
    command: '--developer'

  chromium-tests:
    depends_on:
      weston:
        condition: service_healthy
    device_cgroup_rules:
      - 'c 226:* rmw'
    image: $REGISTRY/torizon/chromium-tests-am62p:stable-rc
    security_opt:
    - seccomp:unconfined
    shm_size: 256mb
    stdin_open: true
    tty: true
    volumes:
      - '/tmp:/tmp'
      - '/var/run/dbus:/var/run/dbus'
      - '/dev/dri:/dev/dri'
