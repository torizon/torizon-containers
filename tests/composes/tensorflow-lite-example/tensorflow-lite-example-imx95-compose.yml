# description: launches the tensorflow lite example
services:
  tensorflow-lite:
    volumes:
        - /dev:/dev
        - /tmp:/tmp
    device_cgroup_rules:
        - 'c 239:0 rmw'
    image: 'torizon/tensorflow-lite-examples-imx95:4'
    command: /bin/sh -lc ". /app/.venv/bin/activate && python3 /app/infer.py"
