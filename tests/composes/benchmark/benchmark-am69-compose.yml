# description: launches the Weston Compositor with shell and then GLMark demo benchmark
services:
  weston:
    network_mode: host
    cap_add:
      - CAP_SYS_TTY_CONFIG
    volumes:
      - '/dev:/dev'
      - '/tmp:/tmp'
      - '/run/udev/:/run/udev/'
    device_cgroup_rules:
      - 'c 4:* rmw'
      - 'c 13:* rmw'
      - 'c 226:* rmw'
    image: '$REGISTRY/torizon/weston-am69:stable-rc'
    command: '--developer'

  benchmark:
    image: $REGISTRY/torizon/benchmark-am69:stable-rc
    environment:
      - MANGOHUD=1
      - MANGOHUD_CONFIG=cpu_temp,gpu_temp,position=top-left,height=500,font_size=32
    volumes:
      - type: bind
        source: /tmp
        target: /tmp
      - type: bind
        source: /dev
        target: /dev
    device_cgroup_rules:
      - "c 4:* rmw"
      - "c 13:* rmw"
      - "c 199:* rmw"
      - "c 226:* rmw"
    depends_on:
      weston:
        condition: service_healthy