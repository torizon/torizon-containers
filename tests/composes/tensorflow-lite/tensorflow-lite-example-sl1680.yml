# description: launches the tensorflow lite example
services:
  tensorflow-lite:
    volumes:
        - /dev:/dev
        - /tmp:/tmp
    device_cgroup_rules:
        - 'c 10:119 rmw'
    image: '$REGISTRY/torizon/tensorflow-lite-examples-sl1680:stable-rc'
    command: . /app/.venv/bin/activate && python3 /app/infer.py
