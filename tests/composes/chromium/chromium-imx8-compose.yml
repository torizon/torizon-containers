# description: launches the Weston Compositor with shell and then Chromium opening the Toradex Homepage
services:
  weston:
    network_mode: host
    cap_add:
      - CAP_SYS_TTY_CONFIG
    volumes:
      - '/dev:/dev'
      - '/tmp:/tmp'
      - '/run/udev/:/run/udev/'
    device_cgroup_rules:
      - 'c 4:* rmw'
      - 'c 253:* rmw'
      - 'c 13:* rmw'
      - 'c 226:* rmw'
      - 'c 10:223 rmw'
      - 'c 199:0 rmw'
    image: '$REGISTRY/torizon/weston-imx8:stable-rc'
    command: '--developer --tty=/dev/tty7 -- --debug'

  chromium:
    command: --virtual-keyboard https://www.toradex.com
    depends_on:
    - weston
    device_cgroup_rules:
      - 'c 199:* rmw'
      - 'c 81:* rmw'
      - 'c 234:* rmw'
      - 'c 253:* rmw'
      - 'c 226:* rmw'
      - 'c 235:* rmw'
    image: $REGISTRY/torizon/chromium-imx8:stable-rc
    security_opt:
    - seccomp:unconfined
    shm_size: 256mb
    volumes:
      - '/tmp:/tmp'
      - '/var/run/dbus:/var/run/dbus'
      - '/dev:/dev'
