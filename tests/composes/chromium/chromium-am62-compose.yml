services:
  weston:
    network_mode: host
    cap_add:
      - CAP_SYS_TTY_CONFIG
    volumes:
      - '/dev:/dev'
      - '/tmp:/tmp'
      - '/run/udev/:/run/udev/'
    device_cgroup_rules:
      - 'c 4:* rmw'
      - 'c 13:* rmw'
      - 'c 226:* rmw'
    image: '$REGISTRY/torizon/weston-am62:stable-rc'
    command: '--developer'

  chromium:
    command: --virtual-keyboard https://www.toradex.com
    depends_on:
    - weston
    device_cgroup_rules:
      - 'c 226:* rmw'
    image: $REGISTRY/torizon/chromium-am62:stable-rc
    security_opt:
    - seccomp:unconfined
    shm_size: 256mb
    volumes:
      - '/tmp:/tmp'
      - '/var/run/dbus:/var/run/dbus'
      - '/dev/dri:/dev/dri' 