services:
  pdf-reader:
    image: '$REGISTRY/siliconsignals/pdf-reader-demo:1.0.0'
    container_name: pdf-reader-imx95
    # This demo requires access to DRM, Wayland, and Linux input devices to:
    # - Enable hardware-accelerated rendering on i.MX95 (Arm Mali GPU)
    # - Auto-detect touchscreens and input devices via /dev/input
    # - Support kiosk-style, compositor-less deployments
    # Privileged mode is required for input device scanning (/dev/input)
    privileged: true 
    devices:
      # Direct Rendering Manager for primary GPU and display access
      - /dev/dri:/dev/dri
      # Required by newer kernels/Wayland for graphics memory allocation
      - /dev/dma_heap:/dev/dma_heap
      # Framebuffer fallback
      - /dev/fb0:/dev/fb0
    volumes:
      - /dev:/dev # Mount all devices so we can scan /dev/input
      - /tmp:/tmp
      - /run/udev:/run/udev
    environment:
      - WAYLAND_DISPLAY=wayland-0
      - XDG_RUNTIME_DIR=/tmp/1000-runtime-dir
    restart: unless-stopped
