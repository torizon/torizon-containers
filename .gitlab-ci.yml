stages:
  - lint
  - compose-generate
  - build
  - test
  - report
  - demo-gallery
  - release


include:
  - "/ci-scripts/test/aval-tests.yml"
  - "/ci-scripts/release/release.yml"
  - "/ci-scripts/test/support-files-tests.yml"
  - "/ci-scripts/build/upstream.yml"
  - "/ci-scripts/build/imx8.yml"
  - "/ci-scripts/build/imx93.yml"
  - "/ci-scripts/build/imx95.yml"
  - "/ci-scripts/build/sl1680.yml"
  - "/ci-scripts/build/am62.yml"
  - "/ci-scripts/build/am62p.yml"
  - "/ci-scripts/build/am67a.yml"
  - "/ci-scripts/build/am69.yml"
  - "/ci-scripts/build/jetson.yml"
  - "/ci-scripts/lint/lint.yml"
  - "/ci-scripts/demo-gallery/demo-gallery.yml"

variables:
  MAKE_TAG_RELEASE:
    value: "false"
    description: "Set to true to promote this branch's -rc images to the versions in ci-scripts/container-versions and create a release."
  MAKE_GALLERY_RELEASE:
    value: "false"
    description: "Set to true to publish the demo gallery composes for this branch."

  DEBIAN_POINT_RELEASE: "12.15-slim"
  DEBIAN_POINT_RELEASE_NVIDIA: "forky-slim"
  DOCKERHUB_REGISTRY_URL: "docker.io"
  TORADEX_INTERNAL_DOCKERHUB_CACHE: "artifactory-horw.int.toradex.com/dockerhub-proxy-no-cache-horw"

  # This should be set by docker image already, just to be sure...
  DOCKER_HOST: tcp://docker:2375
  # Use overlayfs driver for better performance
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

  DOCKER_VERSION: "28.4.0"
  PLATFORM_SPECIFIC_FOLDER: "platform-specific"
  SUPPORT_FILES_FOLDER: "support-files"
  IMX8_FOLDER: "imx8"
  IMX93_FOLDER: "imx93"
  IMX95_FOLDER: "imx95"
  AM62_FOLDER: "am62"
  AM62P_FOLDER: "am62p"
  AM67A_FOLDER: "am67a"
  AM69_FOLDER: "am69"
  SL1680_FOLDER: "sl1680"
  JETSON_FOLDER: "jetson"
  UPSTREAM_FOLDER: "upstream"
  TESTS_FOLDER: "tests"
  TESTS_CONTAINERS_FOLDER: "containers"
  CHROMIUM_TESTS_FOLDER: "chromium-tests"
  CROSS_TOOLCHAIN_FOLDER: "cross-toolchain"
  DOTNET_FOLDER: "dotnet"
  SSH_FOLDER: "ssh"
  BASE_FOLDER: "base"
  CORE_FOLDER: "core"
  WAYLAND_BASE_FOLDER: "wayland-base"
  WAYLAND_BASE_DEV_FOLDER: "wayland-base-dev"
  GTK_3_FOLDER: "gtk3"
  GTK_3_TESTS_FOLDER: "gtk3-tests"
  WESTON_FOLDER: "weston"
  GRAPHICS_TESTS_FOLDER: "graphics-tests"
  WESTON_TOUCH_CALIBRATOR_FOLDER: "weston-touch-calibrator"
  QT_TESTS_FOLDER: "qt-tests"
  QT5_WAYLAND_FOLDER: "qt5-wayland"
  QT6_WAYLAND_FOLDER: "qt6-wayland"
  QT5_WAYLAND_EXAMPLES_FOLDER: "qt5-wayland-examples"
  QT6_WAYLAND_EXAMPLES_FOLDER: "qt6-wayland-examples"
  QT6_TESTS_FOLDER: "qt6-wayland-tests"
  QT6_ENTERPRISE_DEMO_FOLDER: "qt6-enterprise"
  DOTNET_BASE_FOLDER: "base"
  DOTNET_DEBUG_FOLDER: "debug"
  DOTNET_WAYLAND_BASE_FOLDER: "wayland-base"
  DOTNET_WAYLAND_DEBUG_FOLDER: "wayland-debug"
  RT_VALIDATION_FOLDER: "rt-validation"
  RT_TESTS_FOLDER: "rt-tests"
  STRESS_TESTS_FOLDER: "stress-tests"
  CHROMIUM_FOLDER: "chromium"
  COG_FOLDER: "cog"
  CRANK_WESTON_FOLDER: "crank-weston"
  TENSORFLOW_LITE_FOLDER: "tensorflow-lite"
  TENSORFLOW_LITE_DEV_FOLDER: "tensorflow-lite-dev"
  TENSORFLOW_LITE_EXAMPLES_FOLDER: "tensorflow-lite-examples"

image: docker:$DOCKER_VERSION

services:
  - name: docker:$DOCKER_VERSION-dind

.include-regctl:
  before_script:
    - apk update && apk add curl
    - curl -L https://github.com/regclient/regclient/releases/download/v0.9.2/regctl-linux-amd64 > /usr/bin/regctl
    # to update the hash: download the metadata the regctl repo, verify the signatures, generate the SHA256SUMS file
    # with `sha256sum -b regctl > SHA256SUMS` and update it here.
    - echo "4da11cfe7009661a498ffafc11f510049864ffb4eb44961743618b3975db3c55 /usr/bin/regctl" > SHA256SUMS
    - if ! sha256sum -c SHA256SUMS; then echo "Checksum for regctl has failed"; fi
    - chmod 755 /usr/bin/regctl
    - regctl registry login docker.io -u $DOCKERHUB_USER -p $DOCKERHUB_TOKEN

.docker-configure:
  script:
    - apk add bash curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.69.2
    - ./ci-scripts/configure/docker-buildx-configure.sh

.docker-build:
  extends: .docker-configure
  variables:
    ADD_TORADEX_REPOSITORY: 1
  script:
    - !reference [.docker-configure, script]
    - apk add curl bash
    - ./ci-scripts/build/docker-build.sh
