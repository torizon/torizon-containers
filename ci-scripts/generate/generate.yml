generate-run-from-compose:
  image: homebrew/brew
  variables:
    GIT_STRATEGY: clone
  rules:
    - if: '($CI_WORLD_REBUILD == "true" || $CI_COMPOSE_GENERATE == "true")'
  script:
    - ls
    - git config --global --add safe.directory $(realpath .)
    - git checkout stable
    - git config user.name "Tordy"
    - git config user.email "tordy@toradex.com"
    - |
      git remote set-url origin \
        https://gitlab-ci-token:${PROJECT_TOKEN}@${CI_SERVER_HOST/#https:\/\//}/${CI_PROJECT_PATH}.git
    - git fetch origin $CI_COMMIT_REF_NAME
    - brew tap homebrew-toradex/decompose https://gitlab.com/toradex/rd/torizon-core/homebrew-toradex
    - brew install homebrew-toradex/decompose/decompose
    - ./ci-scripts/generate/run-from-compose.sh tests/composes '**/*-compose.yml' tests/runs
    - |
      git add .
      if git diff --cached --quiet; then
        echo "No changes to commit"
      else
        git commit -m "auto: generate compose files [ci skip]"
        git push origin HEAD:$CI_COMMIT_REF_NAME
      fi
