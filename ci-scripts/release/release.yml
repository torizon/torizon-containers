default:
  tags:
    - amd64

image:
  name: alpine:latest
  pull_policy: always
prepare:
  stage: release
  rules:
    - if: '$MAKE_TAG_RELEASE == "true"'
  script:
    - apk update && apk add bash curl jq yq
    - curl -L https://github.com/regclient/regclient/releases/download/v0.6.0/regctl-linux-amd64 > /usr/bin/regctl
    # generated with 'sha256sum -b regctl > SHA256SUMS'.
    - echo "44216c0ab3bd41ae30b07392d6cdab6971f48ab3f72400e617f5f0ded4d70742 /usr/bin/regctl" > SHA256SUMS
    - if ! sha256sum -c SHA256SUMS; then echo "Checksum for regctl has failed"; fi
    - chmod 755 /usr/bin/regctl
    - regctl registry login docker.io -u $DOCKERHUB_USER -p $DOCKERHUB_TOKEN
    - chmod +x ./ci-scripts/release/deploy.sh
    - . ./ci-scripts/release-tag.sh
    - . ./ci-scripts/release/release-version.sh
    - printf 'RELEASE_SERIES=%s\nRELEASE_VERSION=%s\n' "$RELEASE_SERIES" "$RELEASE_VERSION" > release.env
    - echo "Releasing $RELEASE_VERSION from ${RELEASE_TAG}-rc"

    - ./ci-scripts/release/deploy.sh $(realpath ./ci-scripts/container-versions/cross-toolchains.yml) $PROJECT_SETTING_REGISTRY_NAMESPACE "$RELEASE_TAG-rc"
    - ./ci-scripts/release/deploy.sh $(realpath ./ci-scripts/container-versions/debian-am62.yml) $PROJECT_SETTING_REGISTRY_NAMESPACE "$RELEASE_TAG-rc"
    - ./ci-scripts/release/deploy.sh $(realpath ./ci-scripts/container-versions/debian-am62p.yml) $PROJECT_SETTING_REGISTRY_NAMESPACE "$RELEASE_TAG-rc"
    - ./ci-scripts/release/deploy.sh $(realpath ./ci-scripts/container-versions/debian-am67a.yml) $PROJECT_SETTING_REGISTRY_NAMESPACE "$RELEASE_TAG-rc"
    - ./ci-scripts/release/deploy.sh $(realpath ./ci-scripts/container-versions/debian-am69.yml) $PROJECT_SETTING_REGISTRY_NAMESPACE "$RELEASE_TAG-rc"
    - ./ci-scripts/release/deploy.sh $(realpath ./ci-scripts/container-versions/debian-imx8.yml) $PROJECT_SETTING_REGISTRY_NAMESPACE "$RELEASE_TAG-rc"
    - ./ci-scripts/release/deploy.sh $(realpath ./ci-scripts/container-versions/debian-imx93.yml) $PROJECT_SETTING_REGISTRY_NAMESPACE "$RELEASE_TAG-rc"
    - ./ci-scripts/release/deploy.sh $(realpath ./ci-scripts/container-versions/debian-imx95.yml) $PROJECT_SETTING_REGISTRY_NAMESPACE "$RELEASE_TAG-rc"
    - ./ci-scripts/release/deploy.sh $(realpath ./ci-scripts/container-versions/debian-jetson.yml) $PROJECT_SETTING_REGISTRY_NAMESPACE "$RELEASE_TAG-rc"
    - ./ci-scripts/release/deploy.sh $(realpath ./ci-scripts/container-versions/debian-sl1680.yml) $PROJECT_SETTING_REGISTRY_NAMESPACE "$RELEASE_TAG-rc"
    - ./ci-scripts/release/deploy.sh $(realpath ./ci-scripts/container-versions/debian-upstream.yml) $PROJECT_SETTING_REGISTRY_NAMESPACE "$RELEASE_TAG-rc"
    - ./ci-scripts/release/deploy.sh $(realpath ./ci-scripts/container-versions/dotnet-8.yml) $PROJECT_SETTING_REGISTRY_NAMESPACE "$RELEASE_TAG-rc"
    - ./ci-scripts/release/deploy.sh $(realpath ./ci-scripts/container-versions/dotnet-10.yml) $PROJECT_SETTING_REGISTRY_NAMESPACE "$RELEASE_TAG-rc"
    - ./ci-scripts/release/deploy.sh $(realpath ./ci-scripts/container-versions/rt-tests.yml) $PROJECT_SETTING_REGISTRY_NAMESPACE "$RELEASE_TAG-rc"


  artifacts:
    reports:
      dotenv: release.env
    paths:
      - release_notes.md

release:
  image:
    name: registry.gitlab.com/gitlab-org/release-cli:latest
    pull_policy: always
  stage: release
  before_script:
    - apk update && apk add curl
  needs:
    - job: prepare
      artifacts: true
  rules:
    - if: '$MAKE_TAG_RELEASE == "true"'
  script:
    - echo "Creating release"
    - chmod +x ./ci-scripts/release/send-slack-message.sh
    - export base_message="Torizon Containers release $RELEASE_VERSION!"
    - export link="https://gitlab.com/toradex/rd/torizon-core/packages-and-containers/torizon-containers/-/releases/$RELEASE_VERSION"
    - export newline="\n" formatted_link="<${link}|Click here for the changelog>"
    - ./ci-scripts/release/send-slack-message.sh $TCCP_CHANNEL_ID $SLACK_TOKEN "$base_message$newline$formatted_link"
    - ./ci-scripts/release/send-slack-message.sh $TECH_MKT_CHANNEL_ID $SLACK_TOKEN "$base_message$newline$formatted_link"

  release:
    name: "Release $RELEASE_VERSION"
    description: release_notes.md
    tag_name: "$RELEASE_VERSION"
    ref: "$CI_COMMIT_SHA"
