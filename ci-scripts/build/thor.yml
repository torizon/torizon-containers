thor:[dotnet-10-wayland]:
  extends: .build-dotnet-wayland-thor-template
  variables:
    DOTNET_VERSIONS_FILE: ./ci-scripts/container-versions/dotnet-10.yml
    DOTNET_KEY: dotnet10-wayland-thor
    DOTNET_BUILD_BASE_IMAGE_NAME: dotnet10-thor
    IMAGE_NAME: dotnet10-wayland-thor
