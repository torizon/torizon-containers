thor:[dotnet-8-wayland]:
  extends: .build-dotnet-wayland-thor-template
  variables:
    DOTNET_VERSIONS_FILE: ./ci-scripts/container-versions/dotnet-8.yml
    DOTNET_KEY: dotnet8-wayland-thor
    DOTNET_BUILD_BASE_IMAGE_NAME: dotnet8-thor
    IMAGE_NAME: dotnet8-wayland-thor
