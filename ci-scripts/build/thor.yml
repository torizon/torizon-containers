default:
  tags:
    - arm64

.build-thor-template:
  retry: 2
  extends: .docker-build
  stage: build
  tags:
    - arm64
  rules:
    - if: '$CI_WORLD_REBUILD == "true" && $CI_WORLD_TEST != "true" && $CI_COMMIT_TAG != "true"'
      when: always
      variables:
        REGISTRY_NAMESPACE: $PROJECT_SETTING_REGISTRY_NAMESPACE
    - if: '$CI_BUILD_THOR == "true" && $CI_WORLD_TEST != "true" && $CI_COMMIT_TAG != "true"'
      when: always
      variables:
        REGISTRY_NAMESPACE: $PROJECT_SETTING_REGISTRY_NAMESPACE
    - if: '$MAKE_RC_RELEASE == "true" && $PLATFORMS =~ /(^|[\s,])thor([\s,]|$)/ && $CI_WORLD_TEST != "true" && $CI_COMMIT_TAG != "true"'
      when: always
      variables:
        REGISTRY_NAMESPACE: $PROJECT_SETTING_REGISTRY_NAMESPACE
  variables:
    BUILD_FOR_ARM_V8: "true"
    L4T_DRIVER_VARIANT: openrm

thor:[base]:
  extends: .build-thor-template
  before_script:
    - export DEBIAN_POINT_RELEASE="${DEBIAN_POINT_RELEASE_NVIDIA}"
  variables:
    BUILD_FOR_AMD64: "true"
    IMAGE_NAME: debian-thor
    DOCKERFILE_FOLDER: "${BASE_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/${BASE_FOLDER}/"
    TORADEX_FEED_URL: "https://feeds.toradex.com/torizon/jetson"
    TORADEX_FEED_PATH: "/forky/wrynose"
    TORADEX_FEED_SUITES: "experimental"
  needs: []

thor:[core]:
  extends: .build-thor-template
  variables:
    BASE_IMAGE_NAME: debian-thor
    IMAGE_NAME: core-thor
    DOCKERFILE_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${JETSON_FOLDER}/${CORE_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${JETSON_FOLDER}/${CORE_FOLDER}/"
  needs: ["thor:[base]"]

thor:[wayland-base]:
  extends: .build-thor-template
  variables:
    BASE_IMAGE_NAME: core-thor
    IMAGE_NAME: wayland-base-thor
    DOCKERFILE_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${JETSON_FOLDER}/${WAYLAND_BASE_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${JETSON_FOLDER}/${WAYLAND_BASE_FOLDER}/"
  needs: ["thor:[core]"]

thor:[wayland-base-dev]:
  extends: .build-thor-template
  variables:
    BASE_IMAGE_NAME: wayland-base-thor
    IMAGE_NAME: wayland-base-dev-thor
    DOCKERFILE_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${JETSON_FOLDER}/${WAYLAND_BASE_DEV_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${JETSON_FOLDER}/${WAYLAND_BASE_DEV_FOLDER}/"
  needs: ["thor:[wayland-base]"]

thor:[qt6-wayland]:
  extends: .build-thor-template
  variables:
    BASE_IMAGE_NAME: wayland-base-thor
    IMAGE_NAME: qt6-wayland-thor
    DOCKERFILE_FOLDER: "${QT6_WAYLAND_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/qt-wayland/"
  needs: ["thor:[wayland-base]"]

thor:[qt6-wayland-examples]:
  extends: .build-thor-template
  variables:
    BASE_IMAGE_NAME: qt6-wayland-thor
    IMAGE_NAME: qt6-wayland-examples-thor
    DOCKERFILE_FOLDER: "${QT6_WAYLAND_EXAMPLES_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/qt-wayland/"
  needs: ["thor:[qt6-wayland]"]

thor:[qt6-wayland-tests]:
  extends: .build-thor-template
  variables:
    BUILD_BASE_IMAGE_NAME: wayland-base-dev-thor
    BASE_IMAGE_NAME: qt6-wayland-examples-thor
    IMAGE_NAME: qt6-wayland-tests-thor
    DOCKERFILE_FOLDER: "${TESTS_FOLDER}/${TESTS_CONTAINERS_FOLDER}/${QT6_TESTS_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/${TESTS_FOLDER}/${QT_TESTS_FOLDER}/"
  needs: ["thor:[wayland-base-dev]", "thor:[qt6-wayland-examples]"]

thor:[weston]:
  extends: .build-thor-template
  before_script:
    - ./${SUPPORT_FILES_FOLDER}/${WESTON_FOLDER}/make_feature_map.sh
  variables:
    BASE_IMAGE_NAME: wayland-base-thor
    IMAGE_NAME: weston-thor
    DOCKERFILE_FOLDER: "${WESTON_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/${WESTON_FOLDER}/"
  needs: ["thor:[wayland-base]"]

thor:[weston-touch-calibrator]:
  extends: .build-thor-template
  variables:
    BASE_IMAGE_NAME: weston-thor
    IMAGE_NAME: weston-touch-calibrator-thor
    DOCKERFILE_FOLDER: "${WESTON_TOUCH_CALIBRATOR_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/${WESTON_TOUCH_CALIBRATOR_FOLDER}/"
  needs: ["thor:[weston]"]

thor:[chromium]:
  extends: .build-thor-template
  variables:
    BASE_IMAGE_NAME: wayland-base-thor
    IMAGE_NAME: chromium-thor
    DOCKERFILE_FOLDER: "${CHROMIUM_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/${CHROMIUM_FOLDER}/"
  needs: ["thor:[wayland-base]"]

thor:[graphics-tests]:
  extends: .build-thor-template
  variables:
    BASE_IMAGE_NAME: wayland-base-thor
    IMAGE_NAME: graphics-tests-thor
    DOCKERFILE_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${JETSON_FOLDER}/${TESTS_FOLDER}/${GRAPHICS_TESTS_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${JETSON_FOLDER}/${TESTS_FOLDER}/${GRAPHICS_TESTS_FOLDER}/"
  needs: ["thor:[wayland-base]"]

thor:[cuda]:
  extends: .build-thor-template
  variables:
    BASE_IMAGE_NAME: core-thor
    IMAGE_NAME: cuda-thor
    CUDA_ARCHS: "sm_110"
    DOCKERFILE_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${JETSON_FOLDER}/${CUDA_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${JETSON_FOLDER}/${CUDA_FOLDER}/"
  needs: ["thor:[core]"]

thor:[gstreamer1.0]:
  extends: .build-thor-template
  variables:
    BASE_IMAGE_NAME: wayland-base-thor
    IMAGE_NAME: gstreamer1.0-thor
    DOCKERFILE_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${JETSON_FOLDER}/${GSTREAMER_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${JETSON_FOLDER}/${GSTREAMER_FOLDER}/"
  needs: ["thor:[wayland-base]"]

.build-dotnet-thor-template:
  extends: .build-thor-template
  before_script:
    - . ./ci-scripts/build/export-dotnet-build-args.sh "${DOTNET_VERSIONS_FILE}" "${DOTNET_KEY}"
    - export DEBIAN_POINT_RELEASE="${DEBIAN_POINT_RELEASE}"
  variables:
    BASE_IMAGE_NAME: debian-thor
    DOCKERFILE_FOLDER: "${DOTNET_FOLDER}/${DOTNET_BASE_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${DOTNET_FOLDER}/${DOTNET_BASE_FOLDER}/"

thor:[dotnet-8]:
  extends: .build-dotnet-thor-template
  variables:
    DOTNET_VERSIONS_FILE: ./ci-scripts/container-versions/dotnet-8.yml
    DOTNET_KEY: dotnet8-thor
    IMAGE_NAME: dotnet8-thor
    DOTNET_RUNTIME: dotnet
  needs: ["thor:[base]"]

thor:[dotnet-10]:
  extends: .build-dotnet-thor-template
  variables:
    DOTNET_VERSIONS_FILE: ./ci-scripts/container-versions/dotnet-10.yml
    DOTNET_KEY: dotnet10-thor
    IMAGE_NAME: dotnet10-thor
    DOTNET_RUNTIME: dotnet
  needs: ["thor:[base]"]

.build-dotnet-asp-thor-template:
  extends: .build-dotnet-thor-template
  variables:
    DOTNET_RUNTIME: aspnetcore

thor:[dotnet-8-asp]:
  extends: .build-dotnet-asp-thor-template
  variables:
    DOTNET_VERSIONS_FILE: ./ci-scripts/container-versions/dotnet-8.yml
    DOTNET_KEY: aspdotnet8-thor
    IMAGE_NAME: aspdotnet8-thor
  needs: ["thor:[base]"]

thor:[dotnet-10-asp]:
  extends: .build-dotnet-asp-thor-template
  variables:
    DOTNET_VERSIONS_FILE: ./ci-scripts/container-versions/dotnet-10.yml
    DOTNET_KEY: aspdotnet10-thor
    IMAGE_NAME: aspdotnet10-thor
  needs: ["thor:[base]"]

.build-dotnet-wayland-thor-template:
