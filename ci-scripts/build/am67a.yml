default:
  tags:
    - internal-network-access

.build-am67a-template:
  retry: 2
  extends: .docker-build
  rules:
    - if: '$CI_WORLD_REBUILD == "true" && $CI_WORLD_TEST != "true" && $CI_COMMIT_TAG != "true"'
      when: always
      variables:
        REGISTRY_NAMESPACE: $PROJECT_SETTING_REGISTRY_NAMESPACE
    - if: '$CI_BUILD_AM67A == "true" && $CI_WORLD_TEST != "true" && $CI_COMMIT_TAG != "true"'
      when: always
      variables:
        REGISTRY_NAMESPACE: $PROJECT_SETTING_REGISTRY_NAMESPACE
  variables:
    BUILD_FOR_ARM_V8: "true"

build-base-am67a:
  extends: .build-am67a-template
  variables:
    BUILD_FOR_AMD64: "true"
    IMAGE_NAME: debian-am67a
    DOCKERFILE_FOLDER: "${BASE_FOLDER}/"
    TORADEX_FEED_URL: "https://feeds.toradex.com/stable/am6x"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/${BASE_FOLDER}/"
  needs: []

build-wayland-base-am67a:
  extends: .build-am67a-template
  variables:
    BASE_IMAGE_NAME: debian-am67a
    IMAGE_NAME: wayland-base-am67a
    ACCEPT_FSL_EULA: 1
    DOCKERFILE_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${AM67A_FOLDER}/${WAYLAND_BASE_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${AM67A_FOLDER}/${WAYLAND_BASE_FOLDER}/"
  needs: [build-base-am67a]

build-wayland-base-dev-am67a:
  extends: .build-am67a-template
  variables:
    BASE_IMAGE_NAME: wayland-base-am67a
    IMAGE_NAME: wayland-base-dev-am67a
    DOCKERFILE_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${AM67A_FOLDER}/${WAYLAND_BASE_DEV_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${AM67A_FOLDER}/${WAYLAND_BASE_DEV_FOLDER}/"
  needs: [build-wayland-base-am67a]

build-weston-am67a:
  extends: .build-am67a-template
  before_script:
    - ./${SUPPORT_FILES_FOLDER}/${WESTON_FOLDER}/make_feature_map.sh
  variables:
    BASE_IMAGE_NAME: wayland-base-am67a
    IMAGE_NAME: weston-am67a
    ACCEPT_FSL_EULA: 1
    DOCKERFILE_FOLDER: "${WESTON_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/${WESTON_FOLDER}/"
  needs: [build-wayland-base-am67a]

build-graphics-tests-am67a:
  extends: .build-am67a-template
  variables:
    BASE_IMAGE_NAME: wayland-base-am67a
    IMAGE_NAME: graphics-tests-am67a
    DOCKERFILE_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${AM67A_FOLDER}/${TESTS_FOLDER}/${GRAPHICS_TESTS_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${AM67A_FOLDER}/${TESTS_FOLDER}/${GRAPHICS_TESTS_FOLDER}/"
  needs: [build-wayland-base-am67a]

build-weston-touch-calibrator-am67a:
  extends: .build-am67a-template
  variables:
    BASE_IMAGE_NAME: weston-am67a
    IMAGE_NAME: weston-touch-calibrator-am67a
    DOCKERFILE_FOLDER: "${WESTON_TOUCH_CALIBRATOR_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/${WESTON_TOUCH_CALIBRATOR_FOLDER}/"
  needs: [build-weston-am67a]

build-qt5-wayland-am67a:
  extends: .build-am67a-template
  variables:
    BASE_IMAGE_NAME: wayland-base-am67a
    IMAGE_NAME: qt5-wayland-am67a
    DOCKERFILE_FOLDER: "${QT5_WAYLAND_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/qt-wayland/"
  needs: [build-wayland-base-am67a]

build-qt5-wayland-am67a-examples:
  extends: .build-am67a-template
  variables:
    BASE_IMAGE_NAME: qt5-wayland-am67a
    IMAGE_NAME: qt5-wayland-examples-am67a
    QT5_EXAMPLES_DEBIAN: 1
    DOCKERFILE_FOLDER: "${QT5_WAYLAND_EXAMPLES_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/qt-wayland/"
  needs: [build-qt5-wayland-am67a]

build-qt6-wayland-am67a:
  extends: .build-am67a-template
  variables:
    BASE_IMAGE_NAME: wayland-base-am67a
    IMAGE_NAME: qt6-wayland-am67a
    DOCKERFILE_FOLDER: "${QT6_WAYLAND_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/qt-wayland/"
  needs: [build-wayland-base-am67a]

build-qt6-wayland-examples-am67a:
  extends: .build-am67a-template
  variables:
    BASE_IMAGE_NAME: qt6-wayland-am67a
    IMAGE_NAME: qt6-wayland-examples-am67a
    DOCKERFILE_FOLDER: "${QT6_WAYLAND_EXAMPLES_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/qt-wayland/"
  needs: [build-qt6-wayland-am67a]

build-qt6-wayland-tests-am67a:
  extends: .build-am67a-template
  variables:
    BUILD_BASE_IMAGE_NAME: wayland-base-dev-am67a
    BASE_IMAGE_NAME: qt6-wayland-examples-am67a
    IMAGE_NAME: qt6-wayland-tests-am67a
    DOCKERFILE_FOLDER: "${TESTS_FOLDER}/${TESTS_CONTAINERS_FOLDER}/${QT6_TESTS_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/${TESTS_FOLDER}/${QT_TESTS_FOLDER}/"
  needs: [build-wayland-base-dev-am67a, build-qt6-wayland-examples-am67a]

build-chromium-am67a:
  extends: .build-am67a-template
  variables:
    BASE_IMAGE_NAME: wayland-base-am67a
    IMAGE_NAME: chromium-am67a
    # Not a typo, we use the AM62 for this, as it's same container
    DOCKERFILE_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${AM62_FOLDER}/${CHROMIUM_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${AM62_FOLDER}/${CHROMIUM_FOLDER}/"
  needs: [build-wayland-base-am67a]

build-chromium-tests-am67a:
  extends: .build-am67a-template
  variables:
    BASE_IMAGE_NAME: chromium-am67a
    IMAGE_NAME: chromium-tests-am67a
    # Not a typo, we use the AM62 for this, as it's same container
    DOCKERFILE_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${AM62_FOLDER}/${TESTS_FOLDER}/${CHROMIUM_TESTS_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${AM62_FOLDER}/${TESTS_FOLDER}/${CHROMIUM_TESTS_FOLDER}/"
  needs: [build-chromium-am67a]

build-cog-am67a:
  extends: .build-am67a-template
  variables:
    BASE_IMAGE_NAME: wayland-base-am67a
    IMAGE_NAME: cog-am67a
    DOCKERFILE_FOLDER: "${COG_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/${COG_FOLDER}/"
  needs: [build-wayland-base-am67a]

.build-dotnet-am67a-template:
  extends: .build-am67a-template
  before_script:
    - . ./ci-scripts/build/export-dotnet-build-args.sh "${DOTNET_VERSIONS_FILE}" "${DOTNET_KEY}"
    - export DEBIAN_POINT_RELEASE="${DEBIAN_POINT_RELEASE}"
  variables:
    BASE_IMAGE_NAME: debian-am67a
    DOCKERFILE_FOLDER: "${DOTNET_FOLDER}/${DOTNET_BASE_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${DOTNET_FOLDER}/${DOTNET_BASE_FOLDER}/"

build-dotnet-8-am67a:
  extends: .build-dotnet-am67a-template
  variables:
    DOTNET_VERSIONS_FILE: ./ci-scripts/container-versions/dotnet-8.yml
    DOTNET_KEY: dotnet8-am67a
    IMAGE_NAME: dotnet8-am67a
    DOTNET_RUNTIME: dotnet
  needs: ["build-base-am67a"]

build-dotnet-10-am67a:
  extends: .build-dotnet-am67a-template
  variables:
    DOTNET_VERSIONS_FILE: ./ci-scripts/container-versions/dotnet-10.yml
    DOTNET_KEY: dotnet10-am67a
    IMAGE_NAME: dotnet10-am67a
    DOTNET_RUNTIME: dotnet
  needs: ["build-base-am67a"]

.build-dotnet-asp-am67a-template:
  extends: .build-dotnet-am67a-template
  variables:
    DOTNET_RUNTIME: aspnetcore

build-dotnet-8-asp-am67a:
  extends: .build-dotnet-asp-am67a-template
  variables:
    DOTNET_VERSIONS_FILE: ./ci-scripts/container-versions/dotnet-8.yml
    DOTNET_KEY: aspdotnet8-am67a
    IMAGE_NAME: aspdotnet8-am67a
  needs: ["build-base-am67a"]

build-dotnet-10-asp-am67a:
  extends: .build-dotnet-asp-am67a-template
  variables:
    DOTNET_VERSIONS_FILE: ./ci-scripts/container-versions/dotnet-10.yml
    DOTNET_KEY: aspdotnet10-am67a
    IMAGE_NAME: aspdotnet10-am67a
  needs: ["build-base-am67a"]

.build-dotnet-wayland-am67a-template:
  extends: .build-am67a-template
  before_script:
    - . ./ci-scripts/build/export-dotnet-build-args.sh "${DOTNET_VERSIONS_FILE}" "${DOTNET_KEY}"
    - export DEBIAN_POINT_RELEASE="${DEBIAN_POINT_RELEASE}"
  variables:
    BUILD_BASE_IMAGE_NAME: "${DOTNET_BUILD_BASE_IMAGE_NAME}"
    BASE_IMAGE_NAME: wayland-base-am67a
    DOCKERFILE_FOLDER: "${DOTNET_FOLDER}/${DOTNET_WAYLAND_BASE_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${DOTNET_FOLDER}/${DOTNET_WAYLAND_BASE_FOLDER}/"

build-dotnet-8-wayland-am67a:
  extends: .build-dotnet-wayland-am67a-template
  variables:
    DOTNET_VERSIONS_FILE: ./ci-scripts/container-versions/dotnet-8.yml
    DOTNET_KEY: dotnet8-wayland-am67a
    DOTNET_BUILD_BASE_IMAGE_NAME: dotnet8-am67a
    IMAGE_NAME: dotnet8-wayland-am67a
  needs: ["build-dotnet-8-am67a", "build-wayland-base-am67a"]

build-dotnet-10-wayland-am67a:
  extends: .build-dotnet-wayland-am67a-template
  variables:
    DOTNET_VERSIONS_FILE: ./ci-scripts/container-versions/dotnet-10.yml
    DOTNET_KEY: dotnet10-wayland-am67a
    DOTNET_BUILD_BASE_IMAGE_NAME: dotnet10-am67a
    IMAGE_NAME: dotnet10-wayland-am67a
  needs: ["build-dotnet-10-am67a", "build-wayland-base-am67a"]

build-arm64-toolchain-am67a:
  extends: .build-am67a-template
  variables:
    BUILD_FOR_ARM_V8: "true"
    BUILD_FOR_AMD64: "true"
    BASE_IMAGE_NAME: debian-am67a
    CROSS_COMPILER: aarch64-linux-gnu
    CROSS_TARGET_ARCH: arm64
    IMAGE_NAME: cross-toolchain-arm64-am67a
    DOCKERFILE_FOLDER: "${CROSS_TOOLCHAIN_FOLDER}/${BASE_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${CROSS_TOOLCHAIN_FOLDER}/${BASE_FOLDER}/"
  needs: ["build-base-am67a"]

build-arm64-toolchain-ssh-am67a:
  extends: .build-am67a-template
  variables:
    BUILD_FOR_ARM_V8: "true"
    BUILD_FOR_AMD64: "true"
    IMAGE_NAME: cross-toolchain-ssh-arm64-am67a
    CROSS_TARGET_ARCH: arm64
    BASE_IMAGE_NAME: cross-toolchain-arm64-am67a
    DOCKERFILE_FOLDER: "${CROSS_TOOLCHAIN_FOLDER}/${SSH_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${CROSS_TOOLCHAIN_FOLDER}/${SSH_FOLDER}/"
  needs: ["build-arm64-toolchain-am67a"]

build-wayland-gtk3-am67a:
  extends: .build-am67a-template
  variables:
    BASE_IMAGE_NAME: wayland-base-am67a
    IMAGE_NAME: wayland-gtk3-am67a
    DOCKERFILE_FOLDER: "${GTK_3_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${GTK_3_FOLDER}/"
  needs: [build-wayland-base-am67a]

build-dotnet-8-gtk3-am67a:
  extends: .build-am67a-template
  before_script:
    - . ./ci-scripts/build/export-dotnet-build-args.sh ./ci-scripts/container-versions/dotnet-8.yml ${IMAGE_NAME}
    - export DEBIAN_POINT_RELEASE="${DEBIAN_POINT_RELEASE}"
  variables:
    BASE_IMAGE_NAME: dotnet8-wayland-am67a
    IMAGE_NAME: dotnet8-gtk3-am67a
    DOCKERFILE_FOLDER: "${GTK_3_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${GTK_3_FOLDER}/"
  needs: [build-dotnet-8-wayland-am67a]

build-dotnet-10-gtk3-am67a:
  extends: .build-am67a-template
  before_script:
    - . ./ci-scripts/build/export-dotnet-build-args.sh ./ci-scripts/container-versions/dotnet-10.yml ${IMAGE_NAME}
    - export DEBIAN_POINT_RELEASE="${DEBIAN_POINT_RELEASE}"
  variables:
    BASE_IMAGE_NAME: dotnet10-wayland-am67a
    IMAGE_NAME: dotnet10-gtk3-am67a
    DOCKERFILE_FOLDER: "${GTK_3_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${GTK_3_FOLDER}/"
  needs: [build-dotnet-10-wayland-am67a]

build-gtk3-tests-am67a:
  extends: .build-am67a-template
  variables:
    BUILD_BASE_IMAGE_NAME: wayland-base-dev-am67a
    BASE_IMAGE_NAME: wayland-gtk3-am67a
    IMAGE_NAME: gtk3-tests-am67a
    DOCKERFILE_FOLDER: "${TESTS_FOLDER}/${TESTS_CONTAINERS_FOLDER}/${GTK_3_TESTS_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/${TESTS_FOLDER}/${GTK_3_TESTS_FOLDER}/"
  needs: [build-wayland-base-dev-am67a, build-wayland-gtk3-am67a]
