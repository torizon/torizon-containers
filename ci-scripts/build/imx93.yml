default:
  tags:
    - arm64

.build-imx93-template:
  retry: 2
  extends: .docker-build
  stage: build
  tags:
    - arm64
  rules:
    - if: '$CI_WORLD_REBUILD == "true" && $CI_WORLD_TEST != "true" && $CI_COMMIT_TAG != "true"'
      when: always
      variables:
        REGISTRY_NAMESPACE: $PROJECT_SETTING_REGISTRY_NAMESPACE
    - if: '$CI_BUILD_IMX93 == "true" && $CI_WORLD_TEST != "true" && $CI_COMMIT_TAG != "true"'
      when: always
      variables:
        REGISTRY_NAMESPACE: $PROJECT_SETTING_REGISTRY_NAMESPACE
  variables:
    BUILD_FOR_ARM_V8: "true"

imx93:[base]:
  extends: .build-imx93-template
  before_script:
    - export DEBIAN_POINT_RELEASE="${DEBIAN_POINT_RELEASE}"
  variables:
    BUILD_FOR_ARM_V8: "true"
    BUILD_FOR_AMD64: "true"
    IMAGE_NAME: debian-imx93
    DOCKERFILE_FOLDER: "${BASE_FOLDER}/"
    TORADEX_FEED_URL: "https://feeds.toradex.com/stable/imx93"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/${BASE_FOLDER}/"
  needs: []

imx93:[wayland-base]:
  extends: .build-imx93-template
  variables:
    BUILD_FOR_ARM_V8: "true"
    BASE_IMAGE_NAME: debian-imx93
    IMAGE_NAME: wayland-base-imx93
    DOCKERFILE_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${IMX93_FOLDER}/${WAYLAND_BASE_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${IMX93_FOLDER}/${WAYLAND_BASE_FOLDER}/"
  needs: ["imx93:[base]"]

imx93:[wayland-base-dev]:
  extends: .build-imx93-template
  variables:
    BUILD_FOR_ARM_V8: "true"
    BASE_IMAGE_NAME: wayland-base-imx93
    IMAGE_NAME: wayland-base-dev-imx93
    DOCKERFILE_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${IMX93_FOLDER}/${WAYLAND_BASE_DEV_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${IMX93_FOLDER}/${WAYLAND_BASE_DEV_FOLDER}/"
  needs: ["imx93:[wayland-base]"]

imx93:[weston]:
  extends: .build-imx93-template
  before_script:
    - ./${SUPPORT_FILES_FOLDER}/${WESTON_FOLDER}/make_feature_map.sh
  variables:
    BUILD_FOR_ARM_V8: "true"
    BASE_IMAGE_NAME: wayland-base-imx93
    IMAGE_NAME: weston-imx93
    DOCKERFILE_FOLDER: "${WESTON_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/${WESTON_FOLDER}/"
  needs: ["imx93:[wayland-base]"]

imx93:[graphics-tests]:
  extends: .build-imx93-template
  variables:
    BUILD_FOR_ARM_V8: "true"
    BASE_IMAGE_NAME: wayland-base-imx93
    IMAGE_NAME: graphics-tests-imx93
    DOCKERFILE_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${IMX93_FOLDER}/${TESTS_FOLDER}/${GRAPHICS_TESTS_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${IMX93_FOLDER}/${TESTS_FOLDER}/${GRAPHICS_TESTS_FOLDER}/"
  needs: ["imx93:[wayland-base]", "imx93:[wayland-base-dev]"]

imx93:[weston-touch-calibrator]:
  extends: .build-imx93-template
  variables:
    BUILD_FOR_ARM_V8: "true"
    BASE_IMAGE_NAME: weston-imx93
    IMAGE_NAME: weston-touch-calibrator-imx93
    DOCKERFILE_FOLDER: "${WESTON_TOUCH_CALIBRATOR_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/${WESTON_TOUCH_CALIBRATOR_FOLDER}/"
  needs: ["imx93:[weston]"]

imx93:[qt5-wayland]:
  extends: .build-imx93-template
  variables:
    BUILD_FOR_ARM_V8: "true"
    BASE_IMAGE_NAME: wayland-base-imx93
    IMAGE_NAME: qt5-wayland-imx93
    DOCKERFILE_FOLDER: "${QT5_WAYLAND_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/qt-wayland/"
  needs: ["imx93:[wayland-base]"]

imx93:[qt5-wayland-examples]:
  extends: .build-imx93-template
  variables:
    BUILD_FOR_ARM_V8: "true"
    BASE_IMAGE_NAME: qt5-wayland-imx93
    IMAGE_NAME: qt5-wayland-examples-imx93
    DOCKERFILE_FOLDER: "${QT5_WAYLAND_EXAMPLES_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/qt-wayland/"
  needs: ["imx93:[qt5-wayland]"]

imx93:[qt6-wayland]:
  extends: .build-imx93-template
  variables:
    BUILD_FOR_ARM_V8: "true"
    BASE_IMAGE_NAME: wayland-base-imx93
    IMAGE_NAME: qt6-wayland-imx93
    DOCKERFILE_FOLDER: "${QT6_WAYLAND_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/qt-wayland/"
  needs: ["imx93:[wayland-base]"]

imx93:[qt6-wayland-examples]:
  extends: .build-imx93-template
  variables:
    BUILD_FOR_ARM_V8: "true"
    BASE_IMAGE_NAME: qt6-wayland-imx93
    IMAGE_NAME: qt6-wayland-examples-imx93
    DOCKERFILE_FOLDER: "${QT6_WAYLAND_EXAMPLES_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/qt-wayland/"
  needs: ["imx93:[qt6-wayland]"]

imx93:[qt6-wayland-tests]:
  extends: .build-imx93-template
  variables:
    BUILD_BASE_IMAGE_NAME: wayland-base-dev-imx93
    BASE_IMAGE_NAME: qt6-wayland-examples-imx93
    IMAGE_NAME: qt6-wayland-tests-imx93
    DOCKERFILE_FOLDER: "${TESTS_FOLDER}/${TESTS_CONTAINERS_FOLDER}/${QT6_TESTS_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/${TESTS_FOLDER}/${QT_TESTS_FOLDER}/"
  needs: ["imx93:[wayland-base-dev]", "imx93:[qt6-wayland-examples]"]

imx93:[chromium]:
  extends: .build-imx93-template
  variables:
    BUILD_FOR_ARM_V8: "true"
    BASE_IMAGE_NAME: wayland-base-imx93
    IMAGE_NAME: chromium-imx93
    DOCKERFILE_FOLDER: "${CHROMIUM_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/${CHROMIUM_FOLDER}/"
  needs: ["imx93:[wayland-base]"]

imx93:[cog]:
  extends: .build-imx93-template
  variables:
    BUILD_FOR_ARM_V8: "true"
    BASE_IMAGE_NAME: wayland-base-imx93
    IMAGE_NAME: cog-imx93
    DOCKERFILE_FOLDER: "${COG_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/${COG_FOLDER}/"
  needs: ["imx93:[wayland-base]"]

.build-dotnet-imx93-template:
  extends: .build-imx93-template
  before_script:
    - . ./ci-scripts/build/export-dotnet-build-args.sh "${DOTNET_VERSIONS_FILE}" "${DOTNET_KEY}"
    - export DEBIAN_POINT_RELEASE="${DEBIAN_POINT_RELEASE}"
  variables:
    BASE_IMAGE_NAME: debian-imx93
    DOCKERFILE_FOLDER: "${DOTNET_FOLDER}/${DOTNET_BASE_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${DOTNET_FOLDER}/${DOTNET_BASE_FOLDER}/"

imx93:[dotnet-8]:
  extends: .build-dotnet-imx93-template
  variables:
    DOTNET_VERSIONS_FILE: ./ci-scripts/container-versions/dotnet-8.yml
    DOTNET_KEY: dotnet8-imx93
    IMAGE_NAME: dotnet8-imx93
    DOTNET_RUNTIME: dotnet
  needs: ["imx93:[base]"]

imx93:[dotnet-10]:
  extends: .build-dotnet-imx93-template
  variables:
    DOTNET_VERSIONS_FILE: ./ci-scripts/container-versions/dotnet-10.yml
    DOTNET_KEY: dotnet10-imx93
    IMAGE_NAME: dotnet10-imx93
    DOTNET_RUNTIME: dotnet
  needs: ["imx93:[base]"]

.build-dotnet-asp-imx93-template:
  extends: .build-dotnet-imx93-template
  variables:
    DOTNET_RUNTIME: aspnetcore

imx93:[dotnet-8-asp]:
  extends: .build-dotnet-asp-imx93-template
  variables:
    DOTNET_VERSIONS_FILE: ./ci-scripts/container-versions/dotnet-8.yml
    DOTNET_KEY: aspdotnet8-imx93
    IMAGE_NAME: aspdotnet8-imx93
  needs: ["imx93:[base]"]

imx93:[dotnet-10-asp]:
  extends: .build-dotnet-asp-imx93-template
  variables:
    DOTNET_VERSIONS_FILE: ./ci-scripts/container-versions/dotnet-10.yml
    DOTNET_KEY: aspdotnet10-imx93
    IMAGE_NAME: aspdotnet10-imx93
  needs: ["imx93:[base]"]

.build-dotnet-wayland-imx93-template:
  extends: .build-imx93-template
  before_script:
    - . ./ci-scripts/build/export-dotnet-build-args.sh "${DOTNET_VERSIONS_FILE}" "${DOTNET_KEY}"
    - export DEBIAN_POINT_RELEASE="${DEBIAN_POINT_RELEASE}"
  variables:
    BUILD_BASE_IMAGE_NAME: "${DOTNET_BUILD_BASE_IMAGE_NAME}"
    BASE_IMAGE_NAME: wayland-base-imx93
    DOCKERFILE_FOLDER: "${DOTNET_FOLDER}/${DOTNET_WAYLAND_BASE_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${DOTNET_FOLDER}/${DOTNET_WAYLAND_BASE_FOLDER}/"

imx93:[dotnet-8-wayland]:
  extends: .build-dotnet-wayland-imx93-template
  variables:
    DOTNET_VERSIONS_FILE: ./ci-scripts/container-versions/dotnet-8.yml
    DOTNET_KEY: dotnet8-wayland-imx93
    DOTNET_BUILD_BASE_IMAGE_NAME: dotnet8-imx93
    IMAGE_NAME: dotnet8-wayland-imx93
  needs: ["imx93:[dotnet-8]", "imx93:[wayland-base]"]

imx93:[dotnet-10-wayland]:
  extends: .build-dotnet-wayland-imx93-template
  variables:
    DOTNET_VERSIONS_FILE: ./ci-scripts/container-versions/dotnet-10.yml
    DOTNET_KEY: dotnet10-wayland-imx93
    DOTNET_BUILD_BASE_IMAGE_NAME: dotnet10-imx93
    IMAGE_NAME: dotnet10-wayland-imx93
  needs: ["imx93:[dotnet-10]", "imx93:[wayland-base]"]

imx93:[arm64-toolchain]:
  extends: .build-imx93-template
  variables:
    BUILD_FOR_ARM_V8: "true"
    BUILD_FOR_AMD64: "true"
    BASE_IMAGE_NAME: debian-imx93
    CROSS_COMPILER: aarch64-linux-gnu
    CROSS_TARGET_ARCH: arm64
    IMAGE_NAME: cross-toolchain-arm64-imx93
    DOCKERFILE_FOLDER: "${CROSS_TOOLCHAIN_FOLDER}/${BASE_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${CROSS_TOOLCHAIN_FOLDER}/${BASE_FOLDER}/"
  needs: ["imx93:[base]"]

imx93:[arm64-toolchain-ssh]:
  extends: .build-imx93-template
  variables:
    BUILD_FOR_ARM_V8: "true"
    BUILD_FOR_AMD64: "true"
    IMAGE_NAME: cross-toolchain-ssh-arm64-imx93
    CROSS_TARGET_ARCH: arm64
    BASE_IMAGE_NAME: cross-toolchain-arm64-imx93
    DOCKERFILE_FOLDER: "${CROSS_TOOLCHAIN_FOLDER}/${SSH_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${CROSS_TOOLCHAIN_FOLDER}/${SSH_FOLDER}/"
  needs: ["imx93:[arm64-toolchain]"]

imx93:[wayland-gtk3]:
  extends: .build-imx93-template
  variables:
    BASE_IMAGE_NAME: wayland-base-imx93
    IMAGE_NAME: wayland-gtk3-imx93
    DOCKERFILE_FOLDER: "${GTK_3_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${GTK_3_FOLDER}/"
  needs: ["imx93:[wayland-base]"]

imx93:[dotnet-8-gtk3]:
  extends: .build-imx93-template
  before_script:
    - . ./ci-scripts/build/export-dotnet-build-args.sh ./ci-scripts/container-versions/dotnet-8.yml ${IMAGE_NAME}
    - export DEBIAN_POINT_RELEASE="${DEBIAN_POINT_RELEASE}"
  variables:
    BASE_IMAGE_NAME: dotnet8-wayland-imx93
    IMAGE_NAME: dotnet8-gtk3-imx93
    DOCKERFILE_FOLDER: "${GTK_3_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${GTK_3_FOLDER}/"
  needs: ["imx93:[dotnet-8-wayland]"]

imx93:[dotnet-10-gtk3]:
  extends: .build-imx93-template
  before_script:
    - . ./ci-scripts/build/export-dotnet-build-args.sh ./ci-scripts/container-versions/dotnet-10.yml ${IMAGE_NAME}
    - export DEBIAN_POINT_RELEASE="${DEBIAN_POINT_RELEASE}"
  variables:
    BASE_IMAGE_NAME: dotnet10-wayland-imx93
    IMAGE_NAME: dotnet10-gtk3-imx93
    DOCKERFILE_FOLDER: "${GTK_3_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${GTK_3_FOLDER}/"
  needs: ["imx93:[dotnet-10-wayland]"]

imx93:[gtk3-tests]:
  extends: .build-imx93-template
  variables:
    BUILD_BASE_IMAGE_NAME: wayland-base-dev-imx93
    BASE_IMAGE_NAME: wayland-gtk3-imx93
    IMAGE_NAME: gtk3-tests-imx93
    DOCKERFILE_FOLDER: "${TESTS_FOLDER}/${TESTS_CONTAINERS_FOLDER}/${GTK_3_TESTS_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/${TESTS_FOLDER}/${GTK_3_TESTS_FOLDER}/"
  needs: ["imx93:[wayland-base-dev]", "imx93:[wayland-gtk3]"]