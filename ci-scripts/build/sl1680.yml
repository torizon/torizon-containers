    DOCKERFILE_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${SL1680_FOLDER}/${TESTS_FOLDER}/${GRAPHICS_TESTS_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${SL1680_FOLDER}/${TESTS_FOLDER}/${GRAPHICS_TESTS_FOLDER}/"
  needs: ["sl1680:[wayland-base]"]

