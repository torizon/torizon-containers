default:
  tags:
    - arm64

.build-sl1680-template:
  retry: 2
  extends: .docker-build
  stage: build
  tags:
    - arm64
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_WORLD_REBUILD == "true" && $CI_WORLD_TEST != "true" && $CI_COMMIT_TAG != "true"'
      when: always
      variables:
        REGISTRY_NAMESPACE: $PROJECT_SETTING_REGISTRY_NAMESPACE
    - if: '$CI_BUILD_SL1680 == "true" && $CI_WORLD_TEST != "true" && $CI_COMMIT_TAG != "true"'
      when: always
      variables:
        REGISTRY_NAMESPACE: $PROJECT_SETTING_REGISTRY_NAMESPACE
  variables:
    BUILD_FOR_ARM_V8: "true"

sl1680:[base]:
  extends: .build-sl1680-template
  before_script:
    - export DEBIAN_POINT_RELEASE="${DEBIAN_POINT_RELEASE}"
  variables:
    BUILD_FOR_ARM_V8: "true"
    BUILD_FOR_AMD64: "true"
    IMAGE_NAME: debian-sl1680
    DOCKERFILE_FOLDER: "${BASE_FOLDER}/"
    TORADEX_FEED_URL: "https://feeds.toradex.com/stable/sl1680"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/${BASE_FOLDER}/"
  needs: []

sl1680:[wayland-base]:
  extends: .build-sl1680-template
  variables:
    BUILD_FOR_ARM_V8: "true"
    BASE_IMAGE_NAME: debian-sl1680
    IMAGE_NAME: wayland-base-sl1680
    DOCKERFILE_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${SL1680_FOLDER}/${WAYLAND_BASE_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${SL1680_FOLDER}/${WAYLAND_BASE_FOLDER}/"
  needs: ["sl1680:[base]"]

sl1680:[wayland-base-dev]:
  extends: .build-sl1680-template
  variables:
    BUILD_FOR_ARM_V8: "true"
    BASE_IMAGE_NAME: wayland-base-sl1680
    IMAGE_NAME: wayland-base-dev-sl1680
    DOCKERFILE_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${SL1680_FOLDER}/${WAYLAND_BASE_DEV_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${SL1680_FOLDER}/${WAYLAND_BASE_DEV_FOLDER}/"
  needs: ["sl1680:[wayland-base]"]

sl1680:[weston]:
  extends: .build-sl1680-template
  before_script:
    - ./${SUPPORT_FILES_FOLDER}/${WESTON_FOLDER}/make_feature_map.sh
  variables:
    BUILD_FOR_ARM_V8: "true"
    BASE_IMAGE_NAME: wayland-base-sl1680
    IMAGE_NAME: weston-sl1680
    DOCKERFILE_FOLDER: "${WESTON_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/${WESTON_FOLDER}/"
  needs: ["sl1680:[wayland-base]"]

sl1680:[graphics-tests]:
  extends: .build-sl1680-template
  variables:
