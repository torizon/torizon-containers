imx95:[gtk3-tests]:
  extends: .build-imx95-template
  variables:
    BUILD_BASE_IMAGE_NAME: wayland-base-dev-imx95
    BASE_IMAGE_NAME: wayland-gtk3-imx95
    IMAGE_NAME: gtk3-tests-imx95
    DOCKERFILE_FOLDER: "${TESTS_FOLDER}/${TESTS_CONTAINERS_FOLDER}/${GTK_3_TESTS_FOLDER}/"
