    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${IMX95_FOLDER}/${TESTS_FOLDER}/${CHROMIUM_TESTS_FOLDER}/"
  needs: ["imx95:[chromium]"]

imx95:[cog]:
  extends: .build-imx95-template
  variables:
