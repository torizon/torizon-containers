.build-dotnet-imx95-template:
  extends: .build-imx95-template
  before_script:
    - . ./ci-scripts/build/export-dotnet-build-args.sh "${DOTNET_VERSIONS_FILE}" "${DOTNET_KEY}"
    - export DEBIAN_POINT_RELEASE="${DEBIAN_POINT_RELEASE}"
  variables:
    BASE_IMAGE_NAME: debian-imx95
    DOCKERFILE_FOLDER: "${DOTNET_FOLDER}/${DOTNET_BASE_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${DOTNET_FOLDER}/${DOTNET_BASE_FOLDER}/"

imx95:[dotnet-8]:
  extends: .build-dotnet-imx95-template
  variables:
    DOTNET_VERSIONS_FILE: ./ci-scripts/container-versions/dotnet-8.yml
    DOTNET_KEY: dotnet8-imx95
    IMAGE_NAME: dotnet8-imx95
    DOTNET_RUNTIME: dotnet
  needs: ["imx95:[base]"]

imx95:[dotnet-10]:
  extends: .build-dotnet-imx95-template
  variables:
    DOTNET_VERSIONS_FILE: ./ci-scripts/container-versions/dotnet-10.yml
    DOTNET_KEY: dotnet10-imx95
    IMAGE_NAME: dotnet10-imx95
    DOTNET_RUNTIME: dotnet
  needs: ["imx95:[base]"]

.build-dotnet-asp-imx95-template:
  extends: .build-dotnet-imx95-template
  variables:
    DOTNET_RUNTIME: aspnetcore

imx95:[dotnet-8-asp]:
  extends: .build-dotnet-asp-imx95-template
  variables:
    DOTNET_VERSIONS_FILE: ./ci-scripts/container-versions/dotnet-8.yml
    DOTNET_KEY: aspdotnet8-imx95
    IMAGE_NAME: aspdotnet8-imx95
  needs: ["imx95:[base]"]

imx95:[dotnet-10-asp]:
  extends: .build-dotnet-asp-imx95-template
  variables:
    DOTNET_VERSIONS_FILE: ./ci-scripts/container-versions/dotnet-10.yml
    DOTNET_KEY: aspdotnet10-imx95
    IMAGE_NAME: aspdotnet10-imx95
  needs: ["imx95:[base]"]

.build-dotnet-wayland-imx95-template:
  extends: .build-imx95-template
  before_script:
    - . ./ci-scripts/build/export-dotnet-build-args.sh "${DOTNET_VERSIONS_FILE}" "${DOTNET_KEY}"
    - export DEBIAN_POINT_RELEASE="${DEBIAN_POINT_RELEASE}"
  variables:
    BUILD_BASE_IMAGE_NAME: "${DOTNET_BUILD_BASE_IMAGE_NAME}"
    BASE_IMAGE_NAME: wayland-base-imx95
    DOCKERFILE_FOLDER: "${DOTNET_FOLDER}/${DOTNET_WAYLAND_BASE_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${DOTNET_FOLDER}/${DOTNET_WAYLAND_BASE_FOLDER}/"

imx95:[dotnet-8-wayland]:
  extends: .build-dotnet-wayland-imx95-template
  variables:
    DOTNET_VERSIONS_FILE: ./ci-scripts/container-versions/dotnet-8.yml
    DOTNET_KEY: dotnet8-wayland-imx95
    DOTNET_BUILD_BASE_IMAGE_NAME: dotnet8-imx95
    IMAGE_NAME: dotnet8-wayland-imx95
  needs: ["imx95:[dotnet-8]", "imx95:[wayland-base]"]

imx95:[dotnet-10-wayland]:
  extends: .build-dotnet-wayland-imx95-template
  variables:
    DOTNET_VERSIONS_FILE: ./ci-scripts/container-versions/dotnet-10.yml
    DOTNET_KEY: dotnet10-wayland-imx95
    DOTNET_BUILD_BASE_IMAGE_NAME: dotnet10-imx95
    IMAGE_NAME: dotnet10-wayland-imx95
  needs: ["imx95:[dotnet-10]", "imx95:[wayland-base]"]

imx95:[arm64-toolchain]:
  extends: .build-imx95-template
  variables:
    BUILD_FOR_ARM_V8: "true"
    BUILD_FOR_AMD64: "true"
    BASE_IMAGE_NAME: debian-imx95
    CROSS_COMPILER: aarch64-linux-gnu
    CROSS_TARGET_ARCH: arm64
    IMAGE_NAME: cross-toolchain-arm64-imx95
    DOCKERFILE_FOLDER: "${CROSS_TOOLCHAIN_FOLDER}/${BASE_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${CROSS_TOOLCHAIN_FOLDER}/${BASE_FOLDER}/"
  needs: ["imx95:[base]"]

imx95:[arm64-toolchain-ssh]:
  extends: .build-imx95-template
  variables:
    BUILD_FOR_ARM_V8: "true"
    BUILD_FOR_AMD64: "true"
    IMAGE_NAME: cross-toolchain-ssh-arm64-imx95
    CROSS_TARGET_ARCH: arm64
    BASE_IMAGE_NAME: cross-toolchain-arm64-imx95
    DOCKERFILE_FOLDER: "${CROSS_TOOLCHAIN_FOLDER}/${SSH_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${CROSS_TOOLCHAIN_FOLDER}/${SSH_FOLDER}/"
  needs: ["imx95:[arm64-toolchain]"]

