default:
  tags:
    - arm64

.build-upstream-template:
  retry: 2
  extends: .docker-build
  stage: build
  tags:
    - arm64
  rules:
    - if: '$CI_WORLD_REBUILD == "true" && $CI_WORLD_TEST != "true" && $CI_COMMIT_TAG != "true"'
      variables:
        REGISTRY_NAMESPACE: $PROJECT_SETTING_REGISTRY_NAMESPACE
    - if: '$CI_BUILD_UPSTREAM == "true" && $CI_WORLD_TEST != "true" && $CI_COMMIT_TAG != "true"'
      when: always
      variables:
        REGISTRY_NAMESPACE: $PROJECT_SETTING_REGISTRY_NAMESPACE
  variables:
    BUILD_FOR_ARM_V8: "true"
    BUILD_FOR_AMD64: "true"

upstream:[base]:
  extends: .build-upstream-template
  before_script:
    - export DEBIAN_POINT_RELEASE="${DEBIAN_POINT_RELEASE}"
  variables:
    BUILD_FOR_ARM_V7: "true"
    IMAGE_NAME: debian
    DOCKERFILE_FOLDER: "${BASE_FOLDER}/"
    TORADEX_FEED_URL: "https://feeds.toradex.com/stable/upstream"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/${BASE_FOLDER}/"
  needs: []

upstream:[wayland-base]:
  extends: .build-upstream-template
  variables:
    BUILD_FOR_ARM_V7: "true"
    BASE_IMAGE_NAME: debian
    IMAGE_NAME: wayland-base
    DOCKERFILE_FOLDER: "${WAYLAND_BASE_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${WAYLAND_BASE_FOLDER}/"
  needs: ["upstream:[base]"]

upstream:[wayland-base-dev]:
  extends: .build-upstream-template
  variables:
    BUILD_FOR_ARM_V7: "true"
    BASE_IMAGE_NAME: wayland-base
    IMAGE_NAME: wayland-base-dev
    DOCKERFILE_FOLDER: "${WAYLAND_BASE_DEV_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${WAYLAND_BASE_DEV_FOLDER}/"
  needs: ["upstream:[wayland-base]"]

upstream:[weston]:
  extends: .build-upstream-template
  before_script:
    - ./${SUPPORT_FILES_FOLDER}/${WESTON_FOLDER}/make_feature_map.sh
  variables:
    BUILD_FOR_ARM_V7: "true"
    BASE_IMAGE_NAME: wayland-base
    IMAGE_NAME: weston
    DOCKERFILE_FOLDER: "${WESTON_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/${WESTON_FOLDER}/"
  needs: ["upstream:[wayland-base]"]

upstream:[graphics-tests]:
  extends: .build-upstream-template
