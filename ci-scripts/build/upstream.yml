    BUILD_FOR_ARM_V7: "true"
    BASE_IMAGE_NAME: wayland-base
    IMAGE_NAME: graphics-tests
    DOCKERFILE_FOLDER: "${TESTS_FOLDER}/${TESTS_CONTAINERS_FOLDER}/${GRAPHICS_TESTS_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${TESTS_FOLDER}/${TESTS_CONTAINERS_FOLDER}/${GRAPHICS_TESTS_FOLDER}/"
  needs: ["upstream:[wayland-base]"]

