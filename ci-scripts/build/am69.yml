default:
  tags:
    - arm64

.build-am69-template:
  retry: 2
  extends: .docker-build
  stage: build
  tags:
    - arm64
  rules:
    - if: '$CI_WORLD_REBUILD == "true" && $CI_WORLD_TEST != "true" && $CI_COMMIT_TAG != "true"'
      when: always
      variables:
        REGISTRY_NAMESPACE: $PROJECT_SETTING_REGISTRY_NAMESPACE
    - if: '$CI_BUILD_AM69 == "true" && $CI_WORLD_TEST != "true" && $CI_COMMIT_TAG != "true"'
      when: always
      variables:
        REGISTRY_NAMESPACE: $PROJECT_SETTING_REGISTRY_NAMESPACE
  variables:
    BUILD_FOR_ARM_V8: "true"

am69:[base]:
  extends: .build-am69-template
  variables:
    BUILD_FOR_AMD64: "true"
    IMAGE_NAME: debian-am69
    DOCKERFILE_FOLDER: "${BASE_FOLDER}/"
    TORADEX_FEED_URL: "https://feeds.toradex.com/stable/am6x"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/${BASE_FOLDER}/"

am69:[wayland-base]:
  extends: .build-am69-template
  variables:
    BASE_IMAGE_NAME: debian-am69
    IMAGE_NAME: wayland-base-am69
    ACCEPT_FSL_EULA: 1
    DOCKERFILE_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${AM69_FOLDER}/${WAYLAND_BASE_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${AM69_FOLDER}/${WAYLAND_BASE_FOLDER}/"
  needs: ["am69:[base]"]

am69:[wayland-base-dev]:
  extends: .build-am69-template
  variables:
    BASE_IMAGE_NAME: wayland-base-am69
    IMAGE_NAME: wayland-base-dev-am69
    DOCKERFILE_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${AM69_FOLDER}/${WAYLAND_BASE_DEV_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${AM69_FOLDER}/${WAYLAND_BASE_DEV_FOLDER}/"
  needs: ["am69:[wayland-base]"]

am69:[weston]:
  extends: .build-am69-template
  before_script:
    - ./${SUPPORT_FILES_FOLDER}/${WESTON_FOLDER}/make_feature_map.sh
  variables:
    BASE_IMAGE_NAME: wayland-base-am69
    IMAGE_NAME: weston-am69
    ACCEPT_FSL_EULA: 1
    DOCKERFILE_FOLDER: "${WESTON_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/${WESTON_FOLDER}/"
  needs: ["am69:[wayland-base]"]

am69:[graphics-tests]:
  extends: .build-am69-template
  variables:
    BASE_IMAGE_NAME: wayland-base-am69
    IMAGE_NAME: graphics-tests-am69
    DOCKERFILE_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${AM69_FOLDER}/${TESTS_FOLDER}/${GRAPHICS_TESTS_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${AM69_FOLDER}/${TESTS_FOLDER}/${GRAPHICS_TESTS_FOLDER}/"
  needs: ["am69:[wayland-base]"]

am69:[weston-touch-calibrator]:
  extends: .build-am69-template
  variables:
    BASE_IMAGE_NAME: weston-am69
    IMAGE_NAME: weston-touch-calibrator-am69
    DOCKERFILE_FOLDER: "${WESTON_TOUCH_CALIBRATOR_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/${WESTON_TOUCH_CALIBRATOR_FOLDER}/"
  needs: ["am69:[weston]"]

am69:[qt5-wayland]:
  extends: .build-am69-template
  variables:
    BASE_IMAGE_NAME: wayland-base-am69
    IMAGE_NAME: qt5-wayland-am69
    DOCKERFILE_FOLDER: "${QT5_WAYLAND_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/qt-wayland/"
  needs: ["am69:[wayland-base]"]

am69:[qt5-wayland-examples]:
  extends: .build-am69-template
  variables:
    BASE_IMAGE_NAME: qt5-wayland-am69
    IMAGE_NAME: qt5-wayland-examples-am69
    QT5_EXAMPLES_DEBIAN: 1
    DOCKERFILE_FOLDER: "${QT5_WAYLAND_EXAMPLES_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/qt-wayland/"
  needs: ["am69:[qt5-wayland]"]

am69:[qt6-wayland]:
  extends: .build-am69-template
  variables:
    BASE_IMAGE_NAME: wayland-base-am69
    IMAGE_NAME: qt6-wayland-am69
    DOCKERFILE_FOLDER: "${QT6_WAYLAND_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/qt-wayland/"
  needs: ["am69:[wayland-base]"]

am69:[qt6-wayland-examples]:
  extends: .build-am69-template
  variables:
    BASE_IMAGE_NAME: qt6-wayland-am69
    IMAGE_NAME: qt6-wayland-examples-am69
    DOCKERFILE_FOLDER: "${QT6_WAYLAND_EXAMPLES_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/qt-wayland/"
  needs: ["am69:[qt6-wayland]"]

am69:[qt6-wayland-tests]:
  extends: .build-am69-template
  variables:
    BUILD_BASE_IMAGE_NAME: wayland-base-dev-am69
    BASE_IMAGE_NAME: qt6-wayland-examples-am69
    IMAGE_NAME: qt6-wayland-tests-am69
    DOCKERFILE_FOLDER: "${TESTS_FOLDER}/${TESTS_CONTAINERS_FOLDER}/${QT6_TESTS_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/${TESTS_FOLDER}/${QT_TESTS_FOLDER}/"
  needs: ["am69:[wayland-base-dev]", "am69:[qt6-wayland-examples]"]

am69:[chromium]:
  extends: .build-am69-template
  variables:
    BASE_IMAGE_NAME: wayland-base-am69
    IMAGE_NAME: chromium-am69
    # Not a typo, we use the AM62 for this, as it's same container
    DOCKERFILE_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${AM62_FOLDER}/${CHROMIUM_FOLDER}/"
    # Since AM69 uses different chromium flags, need to use different start-chromium script
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${AM69_FOLDER}/${CHROMIUM_FOLDER}/"
  needs: ["am69:[wayland-base]"]

am69:[chromium-tests]:
  extends: .build-am69-template
  variables:
    BASE_IMAGE_NAME: chromium-am69
    IMAGE_NAME: chromium-tests-am69
    # Not a typo, we use the AM62 for this, as it's same container
    DOCKERFILE_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${AM62_FOLDER}/${TESTS_FOLDER}/${CHROMIUM_TESTS_FOLDER}/"
    # Since AM69 uses different chromium flags, need to use different start-chromium script
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${PLATFORM_SPECIFIC_FOLDER}/${AM69_FOLDER}/${TESTS_FOLDER}/${CHROMIUM_TESTS_FOLDER}/"
  needs: ["am69:[chromium]"]

am69:[cog]:
  extends: .build-am69-template
  variables:
    BASE_IMAGE_NAME: wayland-base-am69
    IMAGE_NAME: cog-am69
    DOCKERFILE_FOLDER: "${COG_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/${COG_FOLDER}/"
  needs: ["am69:[wayland-base]"]

.build-dotnet-am69-template:
  extends: .build-am69-template
  before_script:
    - . ./ci-scripts/build/export-dotnet-build-args.sh "${DOTNET_VERSIONS_FILE}" "${DOTNET_KEY}"
    - export DEBIAN_POINT_RELEASE="${DEBIAN_POINT_RELEASE}"
  variables:
    BASE_IMAGE_NAME: debian-am69
    DOCKERFILE_FOLDER: "${DOTNET_FOLDER}/${DOTNET_BASE_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${DOTNET_FOLDER}/${DOTNET_BASE_FOLDER}/"

am69:[dotnet-8]:
  extends: .build-dotnet-am69-template
  variables:
    DOTNET_VERSIONS_FILE: ./ci-scripts/container-versions/dotnet-8.yml
    DOTNET_KEY: dotnet8-am69
    IMAGE_NAME: dotnet8-am69
    DOTNET_RUNTIME: dotnet
  needs: ["am69:[base]"]

am69:[dotnet-10]:
  extends: .build-dotnet-am69-template
  variables:
    DOTNET_VERSIONS_FILE: ./ci-scripts/container-versions/dotnet-10.yml
    DOTNET_KEY: dotnet10-am69
    IMAGE_NAME: dotnet10-am69
    DOTNET_RUNTIME: dotnet
  needs: ["am69:[base]"]

.build-dotnet-asp-am69-template:
  extends: .build-dotnet-am69-template
  variables:
    DOTNET_RUNTIME: aspnetcore

am69:[dotnet-8-asp]:
  extends: .build-dotnet-asp-am69-template
  variables:
    DOTNET_VERSIONS_FILE: ./ci-scripts/container-versions/dotnet-8.yml
    DOTNET_KEY: aspdotnet8-am69
    IMAGE_NAME: aspdotnet8-am69
  needs: ["am69:[base]"]

am69:[dotnet-10-asp]:
  extends: .build-dotnet-asp-am69-template
  variables:
    DOTNET_VERSIONS_FILE: ./ci-scripts/container-versions/dotnet-10.yml
    DOTNET_KEY: aspdotnet10-am69
    IMAGE_NAME: aspdotnet10-am69
  needs: ["am69:[base]"]

.build-dotnet-wayland-am69-template:
  extends: .build-am69-template
  before_script:
    - . ./ci-scripts/build/export-dotnet-build-args.sh "${DOTNET_VERSIONS_FILE}" "${DOTNET_KEY}"
    - export DEBIAN_POINT_RELEASE="${DEBIAN_POINT_RELEASE}"
  variables:
    BUILD_BASE_IMAGE_NAME: "${DOTNET_BUILD_BASE_IMAGE_NAME}"
    BASE_IMAGE_NAME: wayland-base-am69
    DOCKERFILE_FOLDER: "${DOTNET_FOLDER}/${DOTNET_WAYLAND_BASE_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${DOTNET_FOLDER}/${DOTNET_WAYLAND_BASE_FOLDER}/"

am69:[dotnet-8-wayland]:
  extends: .build-dotnet-wayland-am69-template
  variables:
    DOTNET_VERSIONS_FILE: ./ci-scripts/container-versions/dotnet-8.yml
    DOTNET_KEY: dotnet8-wayland-am69
    DOTNET_BUILD_BASE_IMAGE_NAME: dotnet8-am69
    IMAGE_NAME: dotnet8-wayland-am69
  needs: ["am69:[dotnet-8]", "am69:[wayland-base]"]

am69:[dotnet-10-wayland]:
  extends: .build-dotnet-wayland-am69-template
  variables:
    DOTNET_VERSIONS_FILE: ./ci-scripts/container-versions/dotnet-10.yml
    DOTNET_KEY: dotnet10-wayland-am69
    DOTNET_BUILD_BASE_IMAGE_NAME: dotnet10-am69
    IMAGE_NAME: dotnet10-wayland-am69
  needs: ["am69:[dotnet-10]", "am69:[wayland-base]"]

am69:[arm64-toolchain]:
  extends: .build-am69-template
  variables:
    BUILD_FOR_ARM_V8: "true"
    BUILD_FOR_AMD64: "true"
    BASE_IMAGE_NAME: debian-am69
    CROSS_COMPILER: aarch64-linux-gnu
    CROSS_TARGET_ARCH: arm64
    IMAGE_NAME: cross-toolchain-arm64-am69
    DOCKERFILE_FOLDER: "${CROSS_TOOLCHAIN_FOLDER}/${BASE_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${CROSS_TOOLCHAIN_FOLDER}/${BASE_FOLDER}/"
  needs: ["am69:[base]"]

am69:[arm64-toolchain-ssh]:
  extends: .build-am69-template
  variables:
    BUILD_FOR_ARM_V8: "true"
    BUILD_FOR_AMD64: "true"
    IMAGE_NAME: cross-toolchain-ssh-arm64-am69
    CROSS_TARGET_ARCH: arm64
    BASE_IMAGE_NAME: cross-toolchain-arm64-am69
    DOCKERFILE_FOLDER: "${CROSS_TOOLCHAIN_FOLDER}/${SSH_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${CROSS_TOOLCHAIN_FOLDER}/${SSH_FOLDER}/"
  needs: ["am69:[arm64-toolchain]"]

am69:[wayland-gtk3]:
  extends: .build-am69-template
  variables:
    BASE_IMAGE_NAME: wayland-base-am69
    IMAGE_NAME: wayland-gtk3-am69
    DOCKERFILE_FOLDER: "${GTK_3_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${GTK_3_FOLDER}/"
  needs: ["am69:[wayland-base]"]

am69:[dotnet-8-gtk3]:
  extends: .build-am69-template
  before_script:
    - . ./ci-scripts/build/export-dotnet-build-args.sh ./ci-scripts/container-versions/dotnet-8.yml ${IMAGE_NAME}
    - export DEBIAN_POINT_RELEASE="${DEBIAN_POINT_RELEASE}"
  variables:
    BASE_IMAGE_NAME: dotnet8-wayland-am69
    IMAGE_NAME: dotnet8-gtk3-am69
    DOCKERFILE_FOLDER: "${GTK_3_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${GTK_3_FOLDER}/"
  needs: ["am69:[dotnet-8-wayland]"]

am69:[dotnet-10-gtk3]:
  extends: .build-am69-template
  before_script:
    - . ./ci-scripts/build/export-dotnet-build-args.sh ./ci-scripts/container-versions/dotnet-10.yml ${IMAGE_NAME}
    - export DEBIAN_POINT_RELEASE="${DEBIAN_POINT_RELEASE}"
  variables:
    BASE_IMAGE_NAME: dotnet10-wayland-am69
    IMAGE_NAME: dotnet10-gtk3-am69
    DOCKERFILE_FOLDER: "${GTK_3_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${GTK_3_FOLDER}/"
  needs: ["am69:[dotnet-10-wayland]"]

am69:[gtk3-tests]:
  extends: .build-am69-template
  variables:
    BUILD_BASE_IMAGE_NAME: wayland-base-dev-am69
    BASE_IMAGE_NAME: wayland-gtk3-am69
    IMAGE_NAME: gtk3-tests-am69
    DOCKERFILE_FOLDER: "${TESTS_FOLDER}/${TESTS_CONTAINERS_FOLDER}/${GTK_3_TESTS_FOLDER}/"
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "${SUPPORT_FILES_FOLDER}/${TESTS_FOLDER}/${GTK_3_TESTS_FOLDER}/"
  needs: ["am69:[wayland-base-dev]", "am69:[wayland-gtk3]"]