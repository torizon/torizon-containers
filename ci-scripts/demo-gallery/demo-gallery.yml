default:
  tags:
    - amd64

build-demo-gallery:
  image:
    name: docker:latest
    pull_policy: always
  stage: demo-gallery
  rules:
    - if: '$MAKE_GALLERY_RELEASE == "true"'
  script:
    - apk update && apk add python3 git
    - . ./ci-scripts/release-tag.sh
    - . ./ci-scripts/release/release-version.sh
    - export DEMO_GALLERY_VERSION="$RELEASE_MAJOR"
    - python3 ci-scripts/demo-gallery/demo-gallerizator.py tests/demo-gallery-composes
    - git clone https://oauth2:${DEMO_GALLERY_TOKEN}@gitlab.com/toradex/rd/torizon-core/packages-and-containers/demo-gallery.git
    - cd ./demo-gallery
    - git config --global --add safe.directory $(realpath .)
    - git config user.name "Tordy"
    - git config user.email "tordy@toradex.com"
    - git rm -r '*'
    - cp -r ../temp/* .
    - git add .
    - |
      if git diff --cached --quiet; then
        echo "No changes to commit"
      else
        git commit -m "auto: update demo gallery [ci skip]"
        git push --force origin HEAD:$RELEASE_TAG
      fi
