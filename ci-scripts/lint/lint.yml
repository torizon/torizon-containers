default:
  tags:
    - saas-linux-small-amd64

.shellcheck:
  image:
    name: koalaman/shellcheck-alpine:latest
    pull_policy: always
  script: find . -type f \( -iname "*.sh" -o -iname "*.bash" -o -iname "*.bats" \) | xargs -r shellcheck --severity=${SHELLCHECK_SEVERITY}
  rules:
    - when: always

shell-errors:
  extends: .shellcheck
  variables:
    SHELLCHECK_SEVERITY: "error"

shell-warnings:
  extends: .shellcheck
  variables:
    SHELLCHECK_SEVERITY: "warning"

shell-format:
  image: mvdan/shfmt:v3.2.0-alpine
  script:
    - find . -type f -iname "*.sh" | xargs -r shfmt -i 2 -ci -d

check-line-breaks:
  image:
    name: alpine:latest
    pull_policy: always
  before_script:
    - apk update
    - apk add file
  script: ./ci-scripts/lint/lint-line-breaks.sh
  rules:
    - when: always

lint-dependencies:
  image:
    name: alpine:latest
    pull_policy: always
  rules:
    - when: always
  before_script:
    - apk update
    - apk add yq bash
  script:
    - ERROR_FOUND=0
    - ./ci-scripts/lint/lint-dependencies.sh ./ci-scripts/build/am62.yml     "-am62"   || ERROR_FOUND=1
    - ./ci-scripts/lint/lint-dependencies.sh ./ci-scripts/build/am62p.yml    "-am62p"  || ERROR_FOUND=1
    - ./ci-scripts/lint/lint-dependencies.sh ./ci-scripts/build/am67a.yml    "-am67a"  || ERROR_FOUND=1
    - ./ci-scripts/lint/lint-dependencies.sh ./ci-scripts/build/am69.yml     "-am69"   || ERROR_FOUND=1
    - ./ci-scripts/lint/lint-dependencies.sh ./ci-scripts/build/imx8.yml     "-imx8"   || ERROR_FOUND=1
    - ./ci-scripts/lint/lint-dependencies.sh ./ci-scripts/build/imx95.yml    "-imx95"  || ERROR_FOUND=1
    - ./ci-scripts/lint/lint-dependencies.sh ./ci-scripts/build/sl1680.yml   "-sl1680" || ERROR_FOUND=1
    - ./ci-scripts/lint/lint-dependencies.sh ./ci-scripts/build/upstream.yml ""        || ERROR_FOUND=1
    - |
      if [ "$ERROR_FOUND" -eq 1 ]; then
        echo "One or more linting checks failed."
        exit 1
      fi

lint-templates:
  image:
    name: alpine:latest
    pull_policy: always
  rules:
    - when: always
  before_script:
    - apk update
    - apk add yq bash
  script:
    - ERROR_FOUND=0
    - ./ci-scripts/lint/lint-templates.sh ./ci-scripts/build/am62.yml     || ERROR_FOUND=1
    - ./ci-scripts/lint/lint-templates.sh ./ci-scripts/build/am62p.yml    || ERROR_FOUND=1
    - ./ci-scripts/lint/lint-templates.sh ./ci-scripts/build/am67a.yml    || ERROR_FOUND=1
    - ./ci-scripts/lint/lint-templates.sh ./ci-scripts/build/am69.yml     || ERROR_FOUND=1
    - ./ci-scripts/lint/lint-templates.sh ./ci-scripts/build/imx8.yml     || ERROR_FOUND=1
    - ./ci-scripts/lint/lint-templates.sh ./ci-scripts/build/imx95.yml    || ERROR_FOUND=1
    - ./ci-scripts/lint/lint-templates.sh ./ci-scripts/build/sl1680.yml   || ERROR_FOUND=1
    - ./ci-scripts/lint/lint-templates.sh ./ci-scripts/build/upstream.yml || ERROR_FOUND=1
    - |
      if [ "$ERROR_FOUND" -eq 1 ]; then
        echo "One or more linting checks failed."
        exit 1
      fi
