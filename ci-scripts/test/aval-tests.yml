aggregate-reports:
  stage: report
  image: homebrew/brew
  rules:
    - if: $[[ inputs.world_test ]] == true
      when: on_success
    # FIXME: very bad
    - if: $[[ inputs.colibri_imx7d_emmc ]] == true || $[[ inputs.verdin_am62dual ]] == true || $[[ inputs.sk_am62 ]] == true || $[[ inputs.sk_am62p ]] == true || $[[ inputs.aquila_am69octa ]] == true || $[[ inputs.apalis_imx6q ]] == true || $[[ inputs.colibri_imx6dl ]] == true || $[[ inputs.colibri_imx6ull_emmc ]] == true || $[[ inputs.apalis_imx8qm ]] == true || $[[ inputs.colibri_imx8qxp ]] == true || $[[ inputs.verdin_imx8mmq ]] == true || $[[ inputs.verdin_imx8mpq ]] == true
      when: on_success
  script:
    - mkdir -p reports
    - mv *.xml reports/
    - brew tap homebrew-toradex/xray-junit-uploader https://gitlab.int.toradex.com/rd/torizon-core-containers/homebrew-toradex.git
    - brew install xray-junit-uploader
    - ./ci-scripts/test/xray-junit-uploader-wrapper.sh
  artifacts:
    paths:
      - reports/
  variables:
    VERDIN_IMX8MPQ_TEST_EXEC_KEY: "TCCP-934"
    VERDIN_AM62DUAL_TEST_EXEC_KEY: "TCCP-954"
    VERDIN_IMX8MMQ_TEST_EXEC_KEY: "TCCP-955"
    APALIS_IMX6Q_TEST_EXEC_KEY: "TCCP-956"
    APALIS_IMX8QM_TEST_EXEC_KEY: "TCCP-957"
    COLIBRI_IMX8QXP_TEST_EXEC_KEY: "TCCP-958"
    COLIBRI_IMX7D_EMMC_TEST_EXEC_KEY: "TCCP-953"
    COLIBRI_IMX6DL_TEST_EXEC_KEY: "TCCP-959"
    COLIBRI_IMX6ULL_EMMC_TEST_EXEC_KEY: "TCCP-960"
    EVK_IMX95_TEST_EXEC_KEY: "TCCP-964"
    SK_AM62_TEST_EXEC_KEY: "TCCP-968"
    SK_AM62P_TEST_EXEC_KEY: "TCCP-979"
    AQUILA_AM69OCTA_TEST_EXEC_KEY: "TCCP-997"
    TORIZON_OS_TEST_PLAN_KEY: "TOR-3748"
