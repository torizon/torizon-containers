stages:
  - build
  - test
  - report

build-tests-container:
  extends: .docker-build
  stage: build
  rules:
    - if: $CI_WORLD_TEST == "true" || $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
      changes:
        - /ci-scripts/test/*
        - tests/**/*
    - if: $CI_TEST_LUNA_SL1680 == "true" || $CI_TEST_ASTRA_SL1680 == "true" || $CI_TEST_COLIBRI_IMX7D_EMMC == "true" || $CI_TEST_VERDIN_AM62DUAL == "true" || $CI_TEST_SK_AM62 == "true" || $CI_TEST_SK_AM62P == "true" || $CI_TEST_VERDIN_AM62QUAD == "true" || $CI_TEST_VERDIN_AM62PQ == "true" || $CI_TEST_AQUILA_AM69OCTA == "true" || $CI_TEST_APALIS_IMX6Q == "true" || $CI_TEST_COLIBRI_IMX6DL == "true" || $CI_TEST_COLIBRI_IMX6ULL_EMMC == "true" || $CI_TEST_APALIS_IMX8QM == "true" || $CI_TEST_COLIBRI_IMX8QXP == "true" || $CI_TEST_VERDIN_IMX8MMQ == "true" || $CI_TEST_VERDIN_IMX8MPQ == "true" || $CI_TEST_SMARC_IMX8MPQ == "true" || $CI_TEST_VERDIN_IMX95H == "true" || $CI_TEST_SMARC_IMX95H == "true" || $CI_TEST_FRDM_IMX93 == "true" || $CI_TEST_X86 == "true"
      when: always
      changes:
        - /ci-scripts/test/*
        - tests/**/*
  variables:
    IMAGE_NAME: torizon-containers-tests
    DOCKERFILE_FOLDER: ./tests/
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "."
    BUILD_FOR_ARM_V8: "true"
    BUILD_FOR_ARM_V7: "true"
    BUILD_FOR_AMD64: "true"

.e2e-test-template:
  stage: test
  image:
    name: registry.gitlab.com/toradex/rd/torizon-core/aval/aval:main
    pull_policy: always
  before_script:
    - cd /aval && /usr/local/bin/entrypoint.sh "docker run -e REGISTRY=$TORADEX_INTERNAL_DOCKERHUB_CACHE -e SOC_UDT=$SOC_UDT -e RM_ON_TEARDOWN=$RM_ON_TEARDOWN --privileged --pid host
      -v /var/run/docker.sock:/var/run/docker.sock -v /home/torizon:/home/torizon -v /sys:/sys
      ${CI_REGISTRY}/${CI_PROJECT_PATH}/torizon-containers-tests:${CI_COMMIT_REF_SLUG}-${CI_PIPELINE_ID} /cases/run-tests.sh"
      --copy-artifact /home/torizon/report.xml $CI_PROJECT_DIR/report.xml --remove-databases --delegation-config $DELEGATION_PATH
      --before "docker kill $(docker ps -qa) || true && docker system prune --all --force" --ignore-different-secondaries-between-updates ${AVAL_EXTRA_OPTIONS}
  allow_failure: true
  script:
    - mv $CI_PROJECT_DIR/report.xml $CI_PROJECT_DIR/report-${CI_JOB_NAME}.xml
  variables:
    TARGET_BUILD_TYPE: "release"
    AVAL_EXTRA_OPTIONS: ""
  artifacts:
    when: always
    reports:
      junit: report-${CI_JOB_NAME}.xml
    paths:
      - ./report-${CI_JOB_NAME}.xml
  needs:
    - build-tests-container
  tags:
    - torizoncore

.e2e-test-stable-template:
  extends: .e2e-test-template
  rules:
    - if: $CI_TEST_STABLE == "true"
      when: on_success
  variables:
    DELEGATION_PATH: "/aval/delegation_config.toml"

