aggregate-reports:
  stage: report
  image: homebrew/brew
  rules:
    - if: $CI_WORLD_TEST == "true"
      when: on_success
    - if: '$CI_TEST_COLIBRI_IMX7D_EMMC == "true" || $CI_TEST_VERDIN_AM62DUAL == "true" || $CI_TEST_SK_AM62 == "true" || $CI_TEST_SK_AM62P == "true" || $CI_TEST_VERDIN_AM62QUAD == "true" || $CI_TEST_VERDIN_AM62PQ == "true" || $CI_TEST_AQUILA_AM69OCTA == "true" || $CI_TEST_APALIS_IMX6Q == "true" || $CI_TEST_COLIBRI_IMX6DL == "true" || $CI_TEST_COLIBRI_IMX6ULL_EMMC == "true" || $CI_TEST_APALIS_IMX8QM == "true" || $CI_TEST_COLIBRI_IMX8QXP == "true" || $CI_TEST_VERDIN_IMX8MMQ == "true" || $CI_TEST_VERDIN_IMX8MPQ == "true" || $CI_TEST_SMARC_IMX8MPQ == "true" || $CI_TEST_VERDIN_IMX95H == "true" || $CI_TEST_SMARC_IMX95H == "true" || $CI_TEST_LUNA_SL1680 == "true" || $CI_TEST_FRDM_IMX93 == "true" || $CI_TEST_X86 == "true" ||  $CI_TEST_EVK_IMX95 == "true"'
      when: on_success
  script:
    - mkdir -p reports
    - mv *.xml reports/
    - brew tap homebrew-toradex/xray-junit-uploader https://gitlab.com/toradex/rd/torizon-core/homebrew-toradex.git
    - brew install xray-junit-uploader
    - ./ci-scripts/test/xray-junit-uploader-wrapper.sh
  artifacts:
    paths:
      - reports/
  variables:
    VERDIN_IMX8MPQ_TEST_EXEC_KEY: "TCCP-934"
    VERDIN_AM62DUAL_TEST_EXEC_KEY: "TCCP-954"
    VERDIN_IMX8MMQ_TEST_EXEC_KEY: "TCCP-955"
    APALIS_IMX6Q_TEST_EXEC_KEY: "TCCP-956"
    APALIS_IMX8QM_TEST_EXEC_KEY: "TCCP-957"
    COLIBRI_IMX8QXP_TEST_EXEC_KEY: "TCCP-958"
    COLIBRI_IMX7D_EMMC_TEST_EXEC_KEY: "TCCP-953"
    COLIBRI_IMX6DL_TEST_EXEC_KEY: "TCCP-959"
    COLIBRI_IMX6ULL_EMMC_TEST_EXEC_KEY: "TCCP-960"
    EVK_IMX95_TEST_EXEC_KEY: "TCCP-964"
    SK_AM62_TEST_EXEC_KEY: "TCCP-968"
    SK_AM62P_TEST_EXEC_KEY: "TCCP-979"
    AQUILA_AM69OCTA_TEST_EXEC_KEY: "TCCP-997"
    VERDIN_AM62QUAD_TEST_EXEC_KEY: "TCCP-1073"
    VERDIN_AM62PQ_TEST_EXEC_KEY: "TCCP-1083"
    SMARC_IMX8MPQ_TEST_EXEC_KEY: "TCCP-1074"
    VERDIN_IMX95H_TEST_EXEC_KEY: "TCCP-1075"
    SMARC_IMX95H_TEST_EXEC_KEY: "TCCP-1076"
    ASTRA_SL1680_TEST_EXEC_KEY: "TCCP-1114"
    LUNA_SL1680_TEST_EXEC_KEY: "TCCP-1150"
    FRDM_IMX93_TEST_EXEC_KEY: "TCCP-1188"
    X86_TEST_EXEC_KEY: "TCCP-1077"
    GIT_CLEAN_FLAGS: none
