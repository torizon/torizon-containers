spec:
  inputs:
    world_test:
      type: boolean
      default: false
      description: "Run all tests (overrides individual machine selections)"
    test_stable:
      type: boolean
      default: false
      description: "Run stable tests for all machines"
    colibri_imx7d_emmc:
      type: boolean
      default: false
      description: "Run tests for Colibri iMX7D eMMC"
    verdin_am62dual:
      type: boolean
      default: false
      description: "Run tests for Verdin AM62 Dual"
    sk_am62:
      type: boolean
      default: false
      description: "Run tests for SK AM62"
    sk_am62p:
      type: boolean
      default: false
      description: "Run tests for SK AM62P"
    aquila_am69octa:
      type: boolean
      default: false
      description: "Run tests for Aquila AM69 Octa"
    apalis_imx6q:
      type: boolean
      default: false
      description: "Run tests for Apalis iMX6Q"
    colibri_imx6dl:
      type: boolean
      default: false
      description: "Run tests for Colibri iMX6DL"
    colibri_imx6ull_emmc:
      type: boolean
      default: false
      description: "Run tests for Colibri iMX6ULL eMMC"
    apalis_imx8qm:
      type: boolean
      default: false
      description: "Run tests for Apalis iMX8QM"
    colibri_imx8qxp:
      type: boolean
      default: false
      description: "Run tests for Colibri iMX8QXP"
    verdin_imx8mmq:
      type: boolean
      default: false
      description: "Run tests for Verdin iMX8MM Quad"
    verdin_imx8mpq:
      type: boolean
      default: false
      description: "Run tests for Verdin iMX8MP Quad"
---

stages:
  - build
  - test
  - report

build-tests-container:
  extends: .docker-build
  stage: build
  rules:
    - if: $[[ inputs.world_test ]] == true || $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
      changes:
        - /ci-scripts/test/*
        - tests/**/*
    # FIXME: very bad
    - if: $[[ inputs.colibri_imx7d_emmc ]] == true || $[[ inputs.verdin_am62dual ]] == true || $[[ inputs.sk_am62 ]] == true || $[[ inputs.sk_am62p ]] == true || $[[ inputs.aquila_am69octa ]] == true || $[[ inputs.apalis_imx6q ]] == true || $[[ inputs.colibri_imx6dl ]] == true || $[[ inputs.colibri_imx6ull_emmc ]] == true || $[[ inputs.apalis_imx8qm ]] == true || $[[ inputs.colibri_imx8qxp ]] == true || $[[ inputs.verdin_imx8mmq ]] == true || $[[ inputs.verdin_imx8mpq ]] == true
      when: always
      changes:
        - /ci-scripts/test/*
        - tests/**/*
  variables:
    IMAGE_NAME: torizon-containers-tests
    DOCKERFILE_FOLDER: ./tests/
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "."
    BUILD_FOR_ARM_V8: "true"
    BUILD_FOR_ARM_V7: "true"

.e2e-test-template:
  stage: test
  image: registry.gitlab.com/toradex/rd/torizon-core/aval/aval:main
  before_script:
    - /usr/local/bin/entrypoint.sh "docker run -e REGISTRY=$TORADEX_INTERNAL_DOCKERHUB_CACHE -e SOC_UDT=$SOC_UDT -e RM_ON_TEARDOWN=$RM_ON_TEARDOWN --privileged --pid host
      -v /var/run/docker.sock:/var/run/docker.sock -v /home/torizon:/home/torizon -v /sys:/sys
      ${CI_REGISTRY}/${CI_PROJECT_PATH}/torizon-containers-tests:${CI_COMMIT_REF_SLUG}-${CI_PIPELINE_ID} /cases/run-tests.sh"
      --copy-artifact /home/torizon/report.xml report.xml --delegation-config ./ci-scripts/test/delegation_config.toml
      --before "docker kill $(docker ps -q) || true && docker system prune --all --force" --ignore-different-secondaries-between-updates ${AVAL_EXTRA_OPTIONS}
  allow_failure: true
  script:
    - mv report.xml report-${CI_JOB_NAME}.xml
  variables:
    TARGET_BUILD_TYPE: "release"
    AVAL_EXTRA_OPTIONS: ""
  rules:
    - if: $[[ inputs.world_test ]] == true
      when: on_success
  artifacts:
    when: always
    reports:
      junit: report-${CI_JOB_NAME}.xml
    paths:
      - ./report-${CI_JOB_NAME}.xml
  needs:
    - build-tests-container

.e2e-test-stable-template:
  extends: .e2e-test-template
  rules:
    - if: $[[ inputs.test_stable ]] == true
      when: on_success

.e2e-test-nightly-template:
  extends: .e2e-test-template
  variables:
    TARGET_BUILD_TYPE: "nightly"

e2e-test-colibri-imx7d-emmc-release:
  extends: .e2e-test-stable-template
  rules:
    - if: $[[ inputs.colibri_imx7d_emmc ]] == true
      when: on_success
  variables:
    SOC_UDT: "colibri-imx7d-emmc"

