stages:
  - build
  - test
  - report

build-tests-container:
  extends: .docker-build
  stage: build
  rules:
    - if: $CI_WORLD_TEST == "true" || $CI_TEST_STABLE == "true" || $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
      changes:
        - /ci-scripts/test/*
        - tests/**/*
    - if: $CI_MERGE_REQUEST_LABELS =~ /test::nightly/ || $CI_MERGE_REQUEST_LABELS =~ /test::release/
      when: always
    - if: >
        $CI_TEST_LUNA_SL1680 == "true" ||
        $CI_TEST_ASTRA_SL1680 == "true" ||
        $CI_TEST_COLIBRI_IMX7D_EMMC == "true" ||
        $CI_TEST_SK_AM62 == "true" ||
        $CI_TEST_SK_AM62P == "true" ||
        $CI_TEST_VERDIN_AM62QUAD == "true" ||
        $CI_TEST_VERDIN_AM62PQ == "true" ||
        $CI_TEST_AQUILA_AM69OCTA == "true" ||
        $CI_TEST_APALIS_IMX6Q == "true" ||
        $CI_TEST_COLIBRI_IMX6DL == "true" ||
        $CI_TEST_COLIBRI_IMX6ULL_EMMC == "true" ||
        $CI_TEST_APALIS_IMX8QM == "true" ||
        $CI_TEST_COLIBRI_IMX8QXP == "true" ||
        $CI_TEST_VERDIN_IMX8MMQ == "true" ||
        $CI_TEST_VERDIN_IMX8MPQ == "true" ||
        $CI_TEST_SMARC_IMX8MPQ == "true" ||
        $CI_TEST_VERDIN_IMX95H == "true" ||
        $CI_TEST_SMARC_IMX95H == "true" ||
        $CI_TEST_AQUILA_IMX95H == "true" ||
        $CI_TEST_BEAGLEY_AI == "true" ||
        $CI_TEST_TORIZON_X86 == "true"
      when: always
      changes:
        - /ci-scripts/test/*
        - tests/**/*
  variables:
    IMAGE_NAME: torizon-containers-tests
    DOCKERFILE_FOLDER: ./tests/
    DOCKERFILE_BUILD_CONTEXT_FOLDER: "."
    BUILD_FOR_ARM_V8: "true"
    BUILD_FOR_ARM_V7: "true"
    BUILD_FOR_AMD64: "true"

.e2e-test-template:
  stage: test
  tags:
    - internal-network-access
  image:
    name: registry.gitlab.com/toradex/rd/torizon-core/magma:main
    pull_policy: always
  before_script:
    - . ./ci-scripts/release-tag.sh
    - |
      if [ "${CI_COMMIT_REF_PROTECTED:-}" = "true" ]; then
        REGISTRY_ARGS="-e REGISTRY=${DOCKERHUB_REGISTRY_URL} -e REGISTRY_NAMESPACE=${PROJECT_SETTING_REGISTRY_NAMESPACE} -e IMAGE_TAG=${RELEASE_TAG}-rc"
        echo "${DOCKERHUB_REGISTRY_URL}/${PROJECT_SETTING_REGISTRY_NAMESPACE}/<image>:${CI_COMMIT_BRANCH-${CI_COMMIT_REF_NAME-}}-rc"
      else
        REGISTRY_ARGS="-e REGISTRY=${CI_REGISTRY} -e REGISTRY_NAMESPACE=${CI_PROJECT_PATH} -e IMAGE_TAG=${CI_COMMIT_REF_SLUG}-magma"
        echo "Local alias tag: ${CI_REGISTRY}/${CI_PROJECT_PATH}/<image>:${CI_COMMIT_REF_SLUG}-magma"
      fi
    # TODO: TAU-124: move this SSH bootstrap into the magma image or
    # magma-client, so each repo doesn't need its own copy
    # $LAB_SSH_PRIVATE_KEY holds the key base64-encoded on a single
    # line — pasting the raw multi-line PEM into GitLab's variable field
    # got mangled (CRLF/whitespace), which `ssh` rejected with
    # "error in libcrypto"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$LAB_SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - LAB_HOST=$(magma-client -p "$PLACE" lab-host)
    - echo "LAB_HOST=$LAB_HOST"
    - ssh-keyscan -H "$LAB_HOST" >> ~/.ssh/known_hosts
    # labgrid's own SSH to the exporter takes the user and key from here
    - printf 'Host %s\n  User %s\n  IdentityFile ~/.ssh/id_ed25519\n  IdentitiesOnly yes\n' "$LAB_HOST" "$LAB_SSH_USER" > ~/.ssh/config
    - chmod 600 ~/.ssh/config
    - ssh -o BatchMode=yes -o ConnectTimeout=5 "$LAB_HOST" true
    - apt update && apt install -y sshpass
    - magma-client -p "$PLACE" acquire
  script:
    - echo -e "\e[0Ksection_start:$(date +%s):prepare\r\e[0KDevice Preparation"
    # teziget-cli picks the Artifactory repo, distro and image of the
    # place's machine and TARGET_BUILD_TYPE. Only Toradex boards install
    # through the Toradex Easy Installer.
    - IMAGE_URL=$(teziget-cli torizon --version "$YOCTO_BRANCH" --build_type "$TARGET_BUILD_TYPE" --place "$PLACE")
    - echo "IMAGE_URL=$IMAGE_URL"
    - |
      FLASH_ARGS="--image-url $IMAGE_URL"
      if [ "$COMMON_TORIZON" != "true" ]; then
        TEZI_URL=$(teziget-cli tezi --build_type "$TARGET_BUILD_TYPE" --place "$PLACE")
        echo "TEZI_URL=$TEZI_URL"
        FLASH_ARGS="--tezi-url $TEZI_URL $FLASH_ARGS"
      fi
    - magma-client -p "$PLACE" flash $FLASH_ARGS --tos-password "$DEVICE_PASSWORD"
        --device-info-file device_information --no-progress
    # The flash leaves the serial console logged in as torizon, so the
    # tests run there with console-run
    - magma-client -p "$PLACE" console-run
        'docker rm -f $(docker ps -aq) || true && docker system prune --all --force'
    - >
      magma-client -p "$PLACE" console-run "docker run
      -e PAID_DOCKERHUB_USER=$PAID_DOCKERHUB_USER
      -e PAID_DOCKERHUB_TOKEN=$PAID_DOCKERHUB_TOKEN
      -e CI_REGISTRY=$CI_REGISTRY
      -e CI_REGISTRY_USER=$CI_REGISTRY_USER
      -e CI_REGISTRY_PASSWORD=$CI_REGISTRY_PASSWORD
      -e CI_COMMIT_REF_SLUG=$CI_COMMIT_REF_SLUG
      ${REGISTRY_ARGS}
      -e RELEASE_TAG=$RELEASE_TAG
      -e SOC_UDT=$SOC_UDT
      --privileged
      --pid host
      -v /var/run/docker.sock:/var/run/docker.sock
      -v /home/torizon:/home/torizon
      -v /sys:/sys
      ${CI_REGISTRY}/${CI_PROJECT_PATH}/torizon-containers-tests:${CI_COMMIT_REF_SLUG}-${CI_PIPELINE_ID}
      /tests/cases/run-tests.sh"
    # The report is a file, so it is copied over SSH
    - . ./device_information
    - SSHPASS="$DEVICE_PASSWORD" sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        "torizon@$DEVICE_IP:/home/torizon/report.xml" "$CI_PROJECT_DIR/report-${CI_JOB_NAME}.xml"
  after_script:
    # Always release the place, even if a step fails, so a bad run doesn't
    # leave the board locked for everyone else
    - magma-client -p "$PLACE" release
  allow_failure: true
  variables:
    TARGET_BUILD_TYPE: "release"
    YOCTO_BRANCH: "scarthgap-7.x.y"
    LAB_SSH_USER: "ci_torizon_containers"
    FF_TIMESTAMPS: true
  artifacts:
    when: always
    reports:
      junit: report-${CI_JOB_NAME}.xml
    paths:
      - ./report-${CI_JOB_NAME}.xml
  needs:
    - build-tests-container

.e2e-test-stable-template:
  extends: .e2e-test-template
  rules:
    - if: $CI_TEST_STABLE == "true"
      when: on_success

.e2e-test-stable-common-template:
  extends: .e2e-test-template
  rules:
    - if: $CI_TEST_STABLE == "true"
      when: on_success
  variables:
    COMMON_TORIZON: "true"

.e2e-test-nightly-template:
  extends: .e2e-test-template
  variables:
    TARGET_BUILD_TYPE: "nightly"

.e2e-test-nightly-common-template:
  extends: .e2e-test-template
  variables:
    TARGET_BUILD_TYPE: "nightly"
    COMMON_TORIZON: "true"

