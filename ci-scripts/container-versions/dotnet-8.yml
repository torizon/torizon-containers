# upstream
dotnet8: &dotnet
  release: &dotnet-release "8.0"
  semver: &dotnet-semver "8.0.30"
  major: 4
  minor: 20
  patch: 0
  alias: [scarthgap, bookworm-scarthgap]
aspdotnet8:
  <<: *dotnet
  minor: 20
  patch: 0
  alias: [scarthgap, bookworm-scarthgap]
dotnet8-debug:
  release: *dotnet-release
  semver: *dotnet-semver
  # The latest version of vsdbg can be obtained by running the follow command:
  # curl -sSL https://aka.ms/getvsdbgsh | /bin/sh /dev/stdin -v latest -l ~/vsdbg
  debugger-version: "18.7.10521.2"
  major: 4
  minor: 20
  patch: 0
  alias: [scarthgap, bookworm-scarthgap]
dotnet8-wayland:
  release: *dotnet-release
  semver: *dotnet-semver
  major: 4
  minor: 20
  patch: 0
  alias: [scarthgap, bookworm-scarthgap]
dotnet8-gtk3:
  major: 4
  minor: 20
  patch: 0
  alias: [scarthgap, bookworm-scarthgap]

